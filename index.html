<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CYBER SURGE: PROTOCOL ZERO - 2D Platformer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05050d;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #00f0ff;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 960px;
      height: 540px;
      max-width: 100vw;
      max-height: 100vh;
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.35), 0 0 70px rgba(255, 0, 85, 0.2);
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #00f0ff;
      background: #090814;
    }
    /* Escalado responsivo en dispositivos móviles */
    @media (max-width: 980px), (max-height: 560px) {
      #game-container {
        width: 100vw;
        height: 56.25vw; /* ratio 16:9 */
        max-height: 100vh;
        max-width: 177.78vh;
        border-radius: 0;
        border-left: none;
        border-right: none;
      }
      #instructions-bar {
        display: none !important;
      }
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    /* CRT Scanline Overlay Effect */
    .scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(18, 16, 38, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 10;
      opacity: 0.7;
    }
    .vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-shadow: inset 0 0 80px rgba(0,0,0,0.85);
      pointer-events: none;
      z-index: 11;
    }
    #instructions-bar {
      margin-top: 10px;
      font-size: 13px;
      color: #a4b3d6;
      display: flex;
      gap: 20px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    #instructions-bar span {
      color: #00f0ff;
      font-weight: bold;
    }

    /* =========================================
       CONTROLES TÁCTILES PARA MÓVIL (CYBER HUD)
       ========================================= */
    #mobile-controls {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 16px;
    }
    .mobile-top-bar {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .mobile-bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
      padding-bottom: 6px;
    }
    /* Inversión de mandos: Salto a la izquierda, dirección a la derecha */
    .mobile-bottom-bar.layout-inverted {
      flex-direction: row-reverse;
    }
    .touch-btn {
      pointer-events: auto;
      touch-action: none;
      background: rgba(16, 12, 38, 0.7);
      border: 2px solid #00f0ff;
      color: #00f0ff;
      border-radius: 12px;
      font-family: inherit;
      font-weight: 800;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.4), inset 0 0 10px rgba(0, 240, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s ease, background 0.08s ease;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    .touch-btn:active, .touch-btn.active {
      background: rgba(0, 240, 255, 0.45);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.8), inset 0 0 14px rgba(0, 240, 255, 0.5);
      transform: scale(0.92);
    }
    .touch-btn-small {
      padding: 6px 12px;
      font-size: 11px;
      letter-spacing: 1px;
      border-radius: 8px;
      border-color: #a4b3d6;
      color: #e2e8f0;
    }
    .touch-dpad {
      display: flex;
      gap: 14px;
    }
    .touch-dir {
      width: 66px;
      height: 66px;
      font-size: 26px;
      border-radius: 50%;
    }
    .touch-jump {
      width: 80px;
      height: 80px;
      font-size: 13px;
      border-radius: 50%;
      border-color: #ff0055;
      color: #ff0055;
      box-shadow: 0 0 16px rgba(255, 0, 85, 0.5), inset 0 0 12px rgba(255, 0, 85, 0.25);
    }
    .touch-jump:active, .touch-jump.active {
      background: rgba(255, 0, 85, 0.45);
      box-shadow: 0 0 24px rgba(255, 0, 85, 0.9), inset 0 0 18px rgba(255, 0, 85, 0.6);
      transform: scale(0.92);
    }

    /* Ocultar controles táctiles en pantallas grandes con ratón */
    @media (hover: hover) and (pointer: fine) and (min-width: 981px) {
      body:not(.touch-enabled) #mobile-controls {
        display: none;
      }
    }

    /* Aviso de rotación en móvil vertical */
    #orientation-warning {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 5, 13, 0.95);
      z-index: 999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #00f0ff;
      font-weight: 800;
      font-size: 18px;
      padding: 24px;
    }
    .orient-icon {
      font-size: 46px;
      margin-bottom: 14px;
      animation: rotatePhone 2.2s infinite ease-in-out;
    }
    @keyframes rotatePhone {
      0% { transform: rotate(0deg); }
      40% { transform: rotate(90deg); }
      70% { transform: rotate(90deg); }
      100% { transform: rotate(0deg); }
    }
    @media screen and (orientation: portrait) and (max-width: 768px) {
      #orientation-warning {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <!-- Aviso de rotación para móvil -->
  <div id="orientation-warning">
    <div class="orient-icon">🔄</div>
    <div>GIRA TU MÓVIL EN HORIZONTAL</div>
    <div style="font-size: 13px; color: #a4b3d6; margin-top: 8px; font-weight: normal;">
      Para disfrutar de la mejor experiencia arcade
    </div>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas" width="960" height="540"></canvas>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- Controles táctiles virtuales en pantalla -->
    <div id="mobile-controls">
      <div class="mobile-top-bar">
        <button id="touch-layout" class="touch-btn touch-btn-small" title="Invertir posición de mandos">⇄ MANDOS: DIESTRO</button>
        <button id="touch-mute" class="touch-btn touch-btn-small">🔊 AUDIO</button>
        <button id="touch-restart" class="touch-btn touch-btn-small">🔄 REINICIAR</button>
      </div>
      <div class="mobile-bottom-bar">
        <div class="touch-dpad">
          <button id="touch-left" class="touch-btn touch-dir">◀</button>
          <button id="touch-right" class="touch-btn touch-dir">▶</button>
        </div>
        <div class="touch-actions">
          <button id="touch-jump" class="touch-btn touch-jump">▲ SALTO</button>
        </div>
      </div>
    </div>
  </div>

  <div id="instructions-bar">
    <div>Moverse: <span>A/D o Flechas</span></div>
    <div>Saltar: <span>Espacio / W / Arriba</span></div>
    <div>Silenciar: <span>M</span></div>
    <div>Reiniciar: <span>R</span></div>
  </div>

<script>
/**
 * CYBER SURGE: PROTOCOL ZERO
 * 2D Platformer Engine en Canvas Vanilla con Audio Procedural
 * Diseñado & Desarrollado por Antigravity
 */

// ==========================================
// 1. SISTEMA DE AUDIO PROCEDURAL (WEB AUDIO)
// ==========================================
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.muted = false;
    this.bgmTimer = null;
    this.currentStep = 0;
    this.tempo = 120; // BPM base
    this.currentLevel = 1;
    this.masterGain = null;
    this.scales = {
      // Diferentes escalas y tonalidades por nivel
      1: { root: 220, type: 'pentatonic', notes: [0, 3, 5, 7, 10, 12, 15, 17] }, // Am pentatónica
      2: { root: 146.83, type: 'dorian', notes: [0, 2, 3, 5, 7, 9, 10, 12] },    // D dorian
      3: { root: 174.61, type: 'phrygian', notes: [0, 1, 3, 5, 7, 8, 10, 12] },  // F phrygian
      4: { root: 164.81, type: 'aeolian', notes: [0, 2, 3, 5, 7, 8, 10, 12] },   // E aeolian
      5: { root: 130.81, type: 'cyber_apex', notes: [0, 1, 4, 5, 7, 8, 11, 12] } // C double harmonic
    };
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.setValueAtTime(0.22, this.ctx.currentTime);
      this.masterGain.connect(this.ctx.destination);
      this.startBGM();
    } else if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  toggleMute() {
    this.muted = !this.muted;
    if (this.masterGain) {
      this.masterGain.gain.setValueAtTime(this.muted ? 0 : 0.22, this.ctx.currentTime);
    }
    return this.muted;
  }

  playTone(freq, type, duration, startVol = 0.3, endVol = 0.001) {
    if (this.muted || !this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(startVol, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(endVol, this.ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    } catch (e) {}
  }

  playJump() {
    if (this.muted || !this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      const now = this.ctx.currentTime;
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.exponentialRampToValueAtTime(540, now + 0.16);
      gain.gain.setValueAtTime(0.28, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start(now);
      osc.stop(now + 0.17);
    } catch (e) {}
  }

  playCoin() {
    if (this.muted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(987.77, now); // B5
      osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start(now);
      osc.stop(now + 0.23);
    } catch (e) {}
  }

  playStomp() {
    if (this.muted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(45, now + 0.18);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start(now);
      osc.stop(now + 0.19);
    } catch (e) {}
  }

  playHurt() {
    if (this.muted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(450, now);
      osc.frequency.linearRampToValueAtTime(80, now + 0.3);
      gain.gain.setValueAtTime(0.45, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start(now);
      osc.stop(now + 0.31);
    } catch (e) {}
  }

  playSpring() {
    if (this.muted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.exponentialRampToValueAtTime(750, now + 0.25);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start(now);
      osc.stop(now + 0.26);
    } catch (e) {}
  }

  playLaser() {
    if (this.muted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(900, now);
      osc.frequency.exponentialRampToValueAtTime(150, now + 0.12);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start(now);
      osc.stop(now + 0.13);
    } catch (e) {}
  }

  playLevelWin() {
    if (this.muted || !this.ctx) return;
    const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
    notes.forEach((freq, idx) => {
      setTimeout(() => {
        this.playTone(freq, 'square', 0.18, 0.32);
      }, idx * 110);
    });
  }

  playGameOver() {
    if (this.muted || !this.ctx) return;
    const notes = [440, 415.3, 392, 349.23];
    notes.forEach((freq, idx) => {
      setTimeout(() => {
        this.playTone(freq, 'sawtooth', 0.28, 0.3);
      }, idx * 180);
    });
  }

  setLevel(levelIndex) {
    this.currentLevel = levelIndex;
    // El tempo aumenta con los niveles
    this.tempo = 112 + (levelIndex * 9);
    if (this.bgmTimer) {
      clearInterval(this.bgmTimer);
      this.startBGM();
    }
  }

  startBGM() {
    if (this.bgmTimer) clearInterval(this.bgmTimer);
    const stepInterval = (60 / this.tempo / 4) * 1000; // semicorcheas (16th notes)

    this.bgmTimer = setInterval(() => {
      if (this.muted || !this.ctx || this.ctx.state !== 'running') return;
      
      const scaleData = this.scales[this.currentLevel] || this.scales[1];
      const step = this.currentStep % 16;
      const root = scaleData.root;
      const notes = scaleData.notes;

      // 1. Bassline (patrón rítmico en corcheas / contratiempos)
      if (step % 2 === 0) {
        const bassNoteIdx = [0, 0, 3, 0, 4, 0, 2, 0][Math.floor(step / 2)];
        const bassFreq = root * Math.pow(2, (notes[bassNoteIdx % notes.length] - 12) / 12);
        this.playTone(bassFreq, 'triangle', 0.12, 0.28);
      }

      // 2. Synth Arpegio Cyberpunk (pasos 16ths con variaciones)
      if (step % 2 === 1 || step === 0 || step === 8) {
        const arpIdx = (step * 3 + this.currentLevel) % notes.length;
        const arpFreq = root * Math.pow(2, (notes[arpIdx] + 12) / 12);
        this.playTone(arpFreq, 'square', 0.08, 0.09);
      }

      // 3. Hi-Hat chiptune de percusión procedural en contratiempos
      if (step % 4 === 2) {
        this.playTone(3200 + Math.random() * 800, 'sawtooth', 0.03, 0.05);
      }

      this.currentStep++;
    }, stepInterval);
  }
}

const audio = new SoundEngine();

// ==========================================
// 2. MOTOR DE PARTÍCULAS
// ==========================================
class ParticleSystem {
  constructor() {
    this.particles = [];
  }

  emit(x, y, color, count = 8, speed = 3, size = 3, life = 35) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const spd = (Math.random() * 0.7 + 0.3) * speed;
      this.particles.push({
        x, y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd,
        color,
        size: Math.random() * size + 1.5,
        maxLife: life,
        life: life
      });
    }
  }

  update() {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.08; // Gravedad suave en partículas
      p.life--;
      if (p.life <= 0) {
        this.particles.splice(i, 1);
      }
    }
  }

  draw(ctx, camX, camY) {
    for (const p of this.particles) {
      const alpha = Math.max(0, p.life / p.maxLife);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.fillRect(p.x - camX, p.y - camY, p.size, p.size);
      ctx.restore();
    }
  }
}

// ==========================================
// 3. CLASE JUGADOR CON FÍSICAS FLUIDAS
// ==========================================
class Player {
  constructor(x, y) {
    this.spawnX = x;
    this.spawnY = y;
    this.reset();
  }

  reset() {
    this.x = this.spawnX;
    this.y = this.spawnY;
    this.w = 26;
    this.h = 42;
    this.vx = 0;
    this.vy = 0;
    this.grounded = false;
    this.facing = 1; // 1: derecha, -1: izquierda
    this.coyoteTimer = 0;
    this.jumpBuffer = 0;
    this.runAnimTimer = 0;
    this.invincibleTimer = 0;
    this.isDead = false;
    this.afterImages = [];
  }

  update(input, level, particles) {
    if (this.isDead) return;

    if (this.invincibleTimer > 0) this.invincibleTimer--;

    // 1. Movimiento Horizontal
    const accel = 0.85;
    const maxSpeed = 5.6;
    const friction = this.grounded ? 0.78 : 0.88;

    if (input.left) {
      this.vx -= accel;
      this.facing = -1;
    } else if (input.right) {
      this.vx += accel;
      this.facing = 1;
    } else {
      this.vx *= friction;
      if (Math.abs(this.vx) < 0.1) this.vx = 0;
    }
    this.vx = Math.max(-maxSpeed, Math.min(maxSpeed, this.vx));

    // Estela de movimiento Cyberpunk (After-images)
    if (Math.abs(this.vx) > 3.8 && Math.random() < 0.35) {
      this.afterImages.push({
        x: this.x,
        y: this.y,
        facing: this.facing,
        alpha: 0.5
      });
    }

    // 2. Gravedad y Físicas Verticales
    const gravity = 0.46;
    const maxFall = 11;
    this.vy += gravity;
    if (this.vy > maxFall) this.vy = maxFall;

    // Coyote Time y Jump Buffer
    if (this.grounded) {
      this.coyoteTimer = 6;
    } else if (this.coyoteTimer > 0) {
      this.coyoteTimer--;
    }

    if (input.jumpPressed) {
      this.jumpBuffer = 6;
      input.jumpPressed = false;
    } else if (this.jumpBuffer > 0) {
      this.jumpBuffer--;
    }

    // Salto reactivo con variación de altura
    if (this.jumpBuffer > 0 && this.coyoteTimer > 0) {
      this.vy = -10.8;
      this.grounded = false;
      this.coyoteTimer = 0;
      this.jumpBuffer = 0;
      audio.playJump();
      particles.emit(this.x + this.w / 2, this.y + this.h, '#00f0ff', 10, 2.5, 2.5, 20);
    }

    // Salto variable: si suelta la tecla de salto mientras sube, reduce velocidad
    if (!input.jump && this.vy < -3.5) {
      this.vy *= 0.65;
    }

    // 3. Resolución de Colisiones AABB
    // Eje X
    this.x += this.vx;
    this.resolveCollisionsX(level);

    // Eje Y
    this.grounded = false;
    this.y += this.vy;
    this.resolveCollisionsY(level, particles);

    // Animación
    if (this.grounded && Math.abs(this.vx) > 0.5) {
      this.runAnimTimer += 0.22;
      if (Math.random() < 0.15) {
        particles.emit(this.x + (this.facing > 0 ? 4 : this.w - 4), this.y + this.h, '#ff0055', 2, 1, 2, 15);
      }
    } else if (this.grounded) {
      this.runAnimTimer = 0;
    }

    // Caída al vacío
    if (this.y > level.height + 150) {
      this.die();
    }

    // Actualizar after-images
    for (let i = this.afterImages.length - 1; i >= 0; i--) {
      this.afterImages[i].alpha -= 0.05;
      if (this.afterImages[i].alpha <= 0) {
        this.afterImages.splice(i, 1);
      }
    }
  }

  resolveCollisionsX(level) {
    for (const plat of level.platforms) {
      if (this.intersects(plat)) {
        if (this.vx > 0) {
          this.x = plat.x - this.w;
          this.vx = 0;
        } else if (this.vx < 0) {
          this.x = plat.x + plat.w;
          this.vx = 0;
        }
      }
    }
  }

  resolveCollisionsY(level, particles) {
    for (const plat of level.platforms) {
      if (this.intersects(plat)) {
        if (this.vy > 0) { // Cayendo sobre plataforma
          this.y = plat.y - this.h;
          this.vy = 0;
          if (!this.grounded) {
            particles.emit(this.x + this.w / 2, this.y + this.h, '#00f0ff', 6, 2, 2, 15);
          }
          this.grounded = true;
          // Plataformas móviles arrastran al jugador
          if (plat.isMoving) {
            this.x += plat.vx || 0;
          }
        } else if (this.vy < 0) { // Golpeando techo
          this.y = plat.y + plat.h;
          this.vy = 0;
        }
      }
    }
  }

  intersects(rect) {
    return (
      this.x < rect.x + rect.w &&
      this.x + this.w > rect.x &&
      this.y < rect.y + rect.h &&
      this.y + this.h > rect.y
    );
  }

  bounceOnEnemy() {
    this.vy = -9.5;
    this.coyoteTimer = 0;
    audio.playStomp();
  }

  hitHazard() {
    if (this.invincibleTimer > 0) return false;
    this.die();
    return true;
  }

  die() {
    if (this.isDead) return;
    this.isDead = true;
    audio.playHurt();
  }

  draw(ctx, camX, camY) {
    // Parpadeo de invulnerabilidad
    if (this.invincibleTimer > 0 && Math.floor(this.invincibleTimer / 4) % 2 === 0) {
      return;
    }

    // Dibujar after-images
    for (const img of this.afterImages) {
      ctx.save();
      ctx.globalAlpha = img.alpha * 0.4;
      ctx.fillStyle = '#00f0ff';
      ctx.fillRect(img.x - camX, img.y - camY, this.w, this.h);
      ctx.restore();
    }

    const px = Math.round(this.x - camX);
    const py = Math.round(this.y - camY);

    ctx.save();
    // Invertir horizontalmente según hacia dónde mira
    if (this.facing === -1) {
      ctx.translate(px + this.w, py);
      ctx.scale(-1, 1);
    } else {
      ctx.translate(px, py);
    }

    // Sombra de brillo Cyberpunk
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 10;

    // 1. Piernas animadas
    ctx.fillStyle = '#1a1f38';
    const legOffset = Math.sin(this.runAnimTimer) * 6;
    if (!this.grounded) {
      // Piernas encogidas en salto
      ctx.fillRect(4, 28, 7, 10);
      ctx.fillRect(15, 26, 7, 8);
    } else {
      ctx.fillRect(4 + legOffset, 28, 7, 14);
      ctx.fillRect(15 - legOffset, 28, 7, 14);
    }

    // 2. Torso Cyber-Armadura
    ctx.fillStyle = '#10172a';
    ctx.fillRect(2, 12, 22, 18);
    // Detalles luminosos del traje
    ctx.fillStyle = '#00f0ff';
    ctx.fillRect(6, 15, 4, 12);
    ctx.fillRect(14, 15, 6, 4);

    // 3. Cabeza & Casco
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(4, 2, 18, 12);

    // 4. Visor Neón Brillante
    ctx.fillStyle = '#00f0ff';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 12;
    ctx.fillRect(12, 5, 11, 4);

    // Bufanda de energía holográfica trasera
    ctx.fillStyle = '#ff0055';
    ctx.shadowColor = '#ff0055';
    const scarfWave = Math.sin(Date.now() * 0.01) * 3;
    ctx.fillRect(-6, 12 + scarfWave, 8, 3);
    ctx.fillRect(-10, 14 + scarfWave, 6, 2);

    ctx.restore();
  }
}

// Nivel 1: Glitch Drone (Patrulla básica horizontal que rebota en bordes)
class GlitchDrone {
  constructor(x, y, range = 120) {
    this.startX = x;
    this.x = x;
    this.y = y;
    this.w = 28;
    this.h = 24;
    this.range = range;
    this.vx = 1.4;
    this.type = 'drone';
    this.isDead = false;
    this.animTimer = 0;
  }

  update(level) {
    this.animTimer += 0.1;
    this.x += this.vx;
    if (this.x > this.startX + this.range || this.x < this.startX - this.range) {
      this.vx *= -1;
    }
  }

  draw(ctx, camX, camY) {
    const px = this.x - camX;
    const py = this.y - camY;
    const hover = Math.sin(this.animTimer) * 2;

    ctx.save();
    ctx.shadowColor = '#ff0055';
    ctx.shadowBlur = 8;
    
    // Cuerpo robótico
    ctx.fillStyle = '#2b091f';
    ctx.fillRect(px, py + hover, this.w, this.h);
    
    // Ojo escáner central
    ctx.fillStyle = '#ff0055';
    const eyeX = this.vx > 0 ? px + 16 : px + 4;
    ctx.fillRect(eyeX, py + hover + 6, 8, 5);

    // Propulsores inferiores
    ctx.fillStyle = '#00f0ff';
    ctx.fillRect(px + 4, py + hover + this.h, 6, 3);
    ctx.fillRect(px + 18, py + hover + this.h, 6, 3);

    ctx.restore();
  }
}

// Nivel 2: Hopper Bot (Patrulla y salta periódicamente)
class HopperBot {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.w = 26;
    this.h = 30;
    this.vx = 1.2;
    this.vy = 0;
    this.grounded = false;
    this.jumpTimer = 60 + Math.random() * 40;
    this.type = 'hopper';
    this.isDead = false;
  }

  update(level) {
    this.vy += 0.45;
    this.x += this.vx;

    // Choque con paredes del nivel
    for (const plat of level.platforms) {
      if (this.intersects(plat)) {
        if (this.vx > 0) {
          this.x = plat.x - this.w;
          this.vx *= -1;
        } else if (this.vx < 0) {
          this.x = plat.x + plat.w;
          this.vx *= -1;
        }
      }
    }

    // Colisión vertical
    this.y += this.vy;
    this.grounded = false;
    for (const plat of level.platforms) {
      if (this.intersects(plat)) {
        if (this.vy > 0) {
          this.y = plat.y - this.h;
          this.vy = 0;
          this.grounded = true;
        }
      }
    }

    // Temporizador de salto
    this.jumpTimer--;
    if (this.jumpTimer <= 0 && this.grounded) {
      this.vy = -8.2;
      this.grounded = false;
      this.jumpTimer = 85 + Math.random() * 40;
    }
  }

  intersects(rect) {
    return (
      this.x < rect.x + rect.w &&
      this.x + this.w > rect.x &&
      this.y < rect.y + rect.h &&
      this.y + this.h > rect.y
    );
  }

  draw(ctx, camX, camY) {
    const px = this.x - camX;
    const py = this.y - camY;

    ctx.save();
    ctx.shadowColor = '#ffe600';
    ctx.shadowBlur = 8;

    // Resorte / Patas
    ctx.fillStyle = '#423c08';
    ctx.fillRect(px + 7, py + 18, 12, 12);

    // Chasis amarillo neón
    ctx.fillStyle = '#ffe600';
    ctx.fillRect(px + 2, py + 2, 22, 18);

    // Núcleo de energía
    ctx.fillStyle = '#090814';
    ctx.fillRect(px + 6, py + 6, 14, 10);
    ctx.fillStyle = '#ff0055';
    ctx.fillRect(px + 9, py + 9, 8, 4);

    ctx.restore();
  }
}

// Nivel 3: Turret Sentry (Fija en plataforma, dispara proyectiles de plasma)
class TurretSentry {
  constructor(x, y, dir = -1) {
    this.x = x;
    this.y = y;
    this.w = 32;
    this.h = 32;
    this.dir = dir; // 1 o -1
    this.shootTimer = 110;
    this.type = 'turret';
    this.isDead = false;
  }

  update(level, projectiles) {
    this.shootTimer--;
    if (this.shootTimer <= 0) {
      this.shootTimer = 130;
      audio.playLaser();
      // Generar proyectil de plasma
      projectiles.push({
        x: this.dir > 0 ? this.x + this.w : this.x - 12,
        y: this.y + 11,
        w: 14,
        h: 6,
        vx: this.dir * 4.2,
        color: '#ff0055'
      });
    }
  }

  draw(ctx, camX, camY) {
    const px = this.x - camX;
    const py = this.y - camY;

    ctx.save();
    ctx.shadowColor = '#ff0055';
    ctx.shadowBlur = 10;

    // Base de torreta
    ctx.fillStyle = '#1c1829';
    ctx.fillRect(px, py + 14, this.w, 18);

    // Cañón
    ctx.fillStyle = '#ff0055';
    if (this.dir < 0) {
      ctx.fillRect(px - 6, py + 8, 18, 8);
    } else {
      ctx.fillRect(px + 20, py + 8, 18, 8);
    }

    // Cabina giratoria
    ctx.fillStyle = '#00f0ff';
    ctx.fillRect(px + 8, py + 2, 16, 14);

    ctx.restore();
  }
}

// Nivel 4: Hunter Drone (Volador aéreo con movimiento sinusoidal de ataque)
class HunterDrone {
  constructor(x, y, distance = 160) {
    this.startX = x;
    this.startY = y;
    this.x = x;
    this.y = y;
    this.w = 30;
    this.h = 24;
    this.distance = distance;
    this.time = Math.random() * Math.PI;
    this.type = 'hunter';
    this.isDead = false;
  }

  update() {
    this.time += 0.04;
    this.x = this.startX + Math.sin(this.time) * this.distance;
    this.y = this.startY + Math.cos(this.time * 2) * 35;
  }

  draw(ctx, camX, camY) {
    const px = this.x - camX;
    const py = this.y - camY;

    ctx.save();
    ctx.shadowColor = '#00ff66';
    ctx.shadowBlur = 10;

    // Alas afiladas de ciber-avispón
    ctx.fillStyle = '#00ff66';
    ctx.beginPath();
    ctx.moveTo(px + 15, py);
    ctx.lineTo(px - 4, py + 12);
    ctx.lineTo(px + 15, py + 20);
    ctx.lineTo(px + 34, py + 12);
    ctx.closePath();
    ctx.fill();

    // Ojo cazador violeta
    ctx.fillStyle = '#150d2a';
    ctx.fillRect(px + 9, py + 7, 12, 10);
    ctx.fillStyle = '#ffe600';
    ctx.fillRect(px + 12, py + 9, 6, 6);

    ctx.restore();
  }
}

// Nivel 5: Apex Sentinel (Persecución activa al jugador + Disparo cargado)
class ApexSentinel {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.w = 34;
    this.h = 44;
    this.vx = 0;
    this.vy = 0;
    this.type = 'apex';
    this.isDead = false;
    this.chargeTimer = 90;
    this.facing = 1;
  }

  update(level, player, projectiles) {
    this.vy += 0.45;
    
    // IA de Persecución
    const dist = player.x - this.x;
    if (Math.abs(dist) < 420) {
      this.facing = dist > 0 ? 1 : -1;
      this.vx = this.facing * 2.3; // Avanza rápido hacia el jugador
    } else {
      this.vx = 0;
    }

    this.x += this.vx;
    // Resolver colisión X con plataformas
    for (const plat of level.platforms) {
      if (this.intersects(plat)) {
        if (this.vx > 0) this.x = plat.x - this.w;
        else if (this.vx < 0) this.x = plat.x + plat.w;
      }
    }

    this.y += this.vy;
    for (const plat of level.platforms) {
      if (this.intersects(plat)) {
        if (this.vy > 0) {
          this.y = plat.y - this.h;
          this.vy = 0;
        }
      }
    }

    // Disparo cargado si está cerca
    this.chargeTimer--;
    if (this.chargeTimer <= 0 && Math.abs(dist) < 380) {
      this.chargeTimer = 110;
      audio.playLaser();
      projectiles.push({
        x: this.facing > 0 ? this.x + this.w : this.x - 14,
        y: this.y + 14,
        w: 16,
        h: 8,
        vx: this.facing * 5.2,
        color: '#ffe600'
      });
    }
  }

  intersects(rect) {
    return (
      this.x < rect.x + rect.w &&
      this.x + this.w > rect.x &&
      this.y < rect.y + rect.h &&
      this.y + this.h > rect.y
    );
  }

  draw(ctx, camX, camY) {
    const px = this.x - camX;
    const py = this.y - camY;

    ctx.save();
    ctx.shadowColor = '#ff0055';
    ctx.shadowBlur = 12;

    // Chasis Blindado Púrpura/Rojo
    ctx.fillStyle = '#1c071d';
    ctx.fillRect(px, py + 8, this.w, 36);

    // Placas de armadura Apex
    ctx.fillStyle = '#ff0055';
    ctx.fillRect(px + 4, py + 12, this.w - 8, 10);
    ctx.fillRect(px + 6, py + 26, this.w - 12, 12);

    // Corona cibernética / Sensores
    ctx.fillStyle = '#ffe600';
    ctx.fillRect(px + 2, py, 6, 8);
    ctx.fillRect(px + this.w - 8, py, 6, 8);

    // Visor Central amenazante
    ctx.fillStyle = '#00f0ff';
    const eyeOffset = this.facing > 0 ? 16 : 4;
    ctx.fillRect(px + eyeOffset, py + 14, 12, 6);

    ctx.restore();
  }
}

// ==========================================
// 6. CONTROLADOR PRINCIPAL DEL JUEGO
// ==========================================
class Game {
  constructor() {
    this.canvas = document.getElementById('gameCanvas');
    this.ctx = this.canvas.getContext('2d');
    this.width = 960;
    this.height = 540;

    this.input = {
      left: false,
      right: false,
      jump: false,
      jumpPressed: false
    };

    this.particles = new ParticleSystem();
    this.projectiles = [];

    this.levels = buildLevels();
    this.currentLevelIdx = 0;
    this.score = 0;
    this.lives = 3;

    // Estados: 'START', 'PLAYING', 'LEVEL_WIN', 'GAME_OVER', 'VICTORY'
    this.state = 'START';
    this.transitionTimer = 0;

    this.camX = 0;
    this.camY = 0;

    this.setupInputs();
    this.loadLevel(0);
    this.lastTime = performance.now();
    this.loop = this.loop.bind(this);
    requestAnimationFrame(this.loop);
  }

  setupInputs() {
    window.addEventListener('keydown', (e) => {
      audio.init();

      if (e.code === 'KeyA' || e.code === 'ArrowLeft') {
        this.input.left = true;
      }
      if (e.code === 'KeyD' || e.code === 'ArrowRight') {
        this.input.right = true;
      }
      if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') {
        if (!this.input.jump) {
          this.input.jumpPressed = true;
        }
        this.input.jump = true;
        // Evitar scroll de pantalla
        e.preventDefault();
      }

      // Reinicio con R
      if (e.code === 'KeyR') {
        if (this.state === 'GAME_OVER' || this.state === 'VICTORY') {
          this.restartGame();
        } else if (this.state === 'PLAYING') {
          this.player.die();
        }
      }

      // Silenciar con M
      if (e.code === 'KeyM') {
        audio.toggleMute();
      }

      // Invertir controles táctiles con I
      if (e.code === 'KeyI') {
        this.toggleControlLayout();
      }

      // Iniciar juego desde pantalla de inicio
      if (this.state === 'START') {
        this.state = 'PLAYING';
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') {
        this.input.left = false;
      }
      if (e.code === 'KeyD' || e.code === 'ArrowRight') {
        this.input.right = false;
      }
      if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') {
        this.input.jump = false;
      }
    });

    // Clic en pantalla para iniciar en dispositivos táctiles / mouse
    this.canvas.addEventListener('pointerdown', () => {
      audio.init();
      if (this.state === 'START') {
        this.state = 'PLAYING';
      } else if (this.state === 'GAME_OVER' || this.state === 'VICTORY') {
        this.restartGame();
      }
    });

    // Configuración de controles táctiles en pantalla (Móviles / Tablets)
    this.setupTouchControls();
  }

  setupTouchControls() {
    // Detectar si el dispositivo tiene pantalla táctil o pantalla reducida
    const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (window.innerWidth <= 980);
    if (isTouch) {
      document.body.classList.add('touch-enabled');
    }

    const bindTouch = (elem, onStart, onEnd) => {
      if (!elem) return;
      
      const handleStart = (e) => {
        if (e.cancelable) e.preventDefault();
        e.stopPropagation();
        audio.init();
        elem.classList.add('active');
        onStart();
      };

      const handleEnd = (e) => {
        if (e.cancelable) e.preventDefault();
        e.stopPropagation();
        elem.classList.remove('active');
        onEnd();
      };

      elem.addEventListener('touchstart', handleStart, { passive: false });
      elem.addEventListener('touchend', handleEnd, { passive: false });
      elem.addEventListener('touchcancel', handleEnd, { passive: false });

      // Soporte adicional para mouse / emulador táctil en DevTools
      elem.addEventListener('mousedown', (e) => {
        audio.init();
        elem.classList.add('active');
        onStart();
      });
      elem.addEventListener('mouseup', () => {
        elem.classList.remove('active');
        onEnd();
      });
      elem.addEventListener('mouseleave', () => {
        elem.classList.remove('active');
        onEnd();
      });
    };

    const btnLeft = document.getElementById('touch-left');
    const btnRight = document.getElementById('touch-right');
    const btnJump = document.getElementById('touch-jump');
    const btnMute = document.getElementById('touch-mute');
    const btnRestart = document.getElementById('touch-restart');
    const btnLayout = document.getElementById('touch-layout');

    // Cargar preferencia guardada de posición de teclas
    this.controlsInverted = localStorage.getItem('cybersurge_controls_inverted') === 'true';
    this.applyControlLayout();

    if (btnLayout) {
      const handleLayoutToggle = (e) => {
        if (e.cancelable) e.preventDefault();
        e.stopPropagation();
        audio.init();
        this.toggleControlLayout();
      };
      btnLayout.addEventListener('touchstart', handleLayoutToggle, { passive: false });
      btnLayout.addEventListener('click', handleLayoutToggle);
    }

    bindTouch(btnLeft, () => {
      this.input.left = true;
    }, () => {
      this.input.left = false;
    });

    bindTouch(btnRight, () => {
      this.input.right = true;
    }, () => {
      this.input.right = false;
    });

    bindTouch(btnJump, () => {
      if (!this.input.jump) {
        this.input.jumpPressed = true;
      }
      this.input.jump = true;

      if (this.state === 'START') {
        this.state = 'PLAYING';
      } else if (this.state === 'GAME_OVER' || this.state === 'VICTORY') {
        this.restartGame();
      }
    }, () => {
      this.input.jump = false;
    });

    if (btnMute) {
      const toggleAudio = (e) => {
        if (e.cancelable) e.preventDefault();
        e.stopPropagation();
        audio.init();
        const isMuted = audio.toggleMute();
        btnMute.innerText = isMuted ? '🔇 MUTE' : '🔊 AUDIO';
        btnMute.style.borderColor = isMuted ? '#ff0055' : '#a4b3d6';
        btnMute.style.color = isMuted ? '#ff0055' : '#e2e8f0';
      };
      btnMute.addEventListener('touchstart', toggleAudio, { passive: false });
      btnMute.addEventListener('click', toggleAudio);
    }

    if (btnRestart) {
      const triggerRestart = (e) => {
        if (e.cancelable) e.preventDefault();
        e.stopPropagation();
        audio.init();
        if (this.state === 'GAME_OVER' || this.state === 'VICTORY') {
          this.restartGame();
        } else if (this.state === 'PLAYING') {
          this.player.die();
        }
      };
      btnRestart.addEventListener('touchstart', triggerRestart, { passive: false });
      btnRestart.addEventListener('click', triggerRestart);
    }
  }

  toggleControlLayout() {
    this.controlsInverted = !this.controlsInverted;
    localStorage.setItem('cybersurge_controls_inverted', this.controlsInverted);
    this.applyControlLayout();
    audio.playTone(660, 'sine', 0.08, 0.2);
  }

  applyControlLayout() {
    const bottomBar = document.querySelector('.mobile-bottom-bar');
    const btnLayout = document.getElementById('touch-layout');
    
    if (bottomBar) {
      if (this.controlsInverted) {
        bottomBar.classList.add('layout-inverted');
      } else {
        bottomBar.classList.remove('layout-inverted');
      }
    }

    if (btnLayout) {
      if (this.controlsInverted) {
        btnLayout.innerText = '⇄ MANDOS: ZURDO (SALTO IZQ)';
        btnLayout.style.borderColor = '#ffe600';
        btnLayout.style.color = '#ffe600';
      } else {
        btnLayout.innerText = '⇄ MANDOS: DIESTRO (SALTO DER)';
        btnLayout.style.borderColor = '#a4b3d6';
        btnLayout.style.color = '#e2e8f0';
      }
    }
  }

  loadLevel(idx) {
    this.currentLevelIdx = idx;
    this.level = this.levels[idx];
    this.player = new Player(this.level.playerStart.x, this.level.playerStart.y);
    this.projectiles = [];
    audio.setLevel(idx + 1);
  }

  restartGame() {
    this.levels = buildLevels();
    this.score = 0;
    this.lives = 3;
    this.state = 'PLAYING';
    this.loadLevel(0);
  }

  update() {
    if (this.state === 'PLAYING') {
      // 1. Actualizar Plataformas Móviles
      for (const plat of this.level.movingPlatforms) {
        if (plat.vertical) {
          plat.y += plat.vy;
          if (plat.y <= plat.minY || plat.y >= plat.maxY) plat.vy *= -1;
        } else {
          plat.x += plat.vx;
          if (plat.x <= plat.minX || plat.x >= plat.maxX) plat.vx *= -1;
        }
      }

      // 2. Actualizar Peligros (Láseres temporizados)
      for (const haz of this.level.hazards) {
        if (haz.type === 'laser') {
          haz.timer = (haz.timer || 0) + 1;
          if (haz.timer % haz.cycle === 0) {
            haz.active = !haz.active;
          }
        }
      }

      // 3. Actualizar Jugador
      this.player.update(this.input, this.level, this.particles);

      // Si el jugador murió
      if (this.player.isDead) {
        this.particles.emit(this.player.x + this.player.w / 2, this.player.y + this.player.h / 2, '#ff0055', 24, 4, 3.5, 45);
        this.lives--;
        if (this.lives <= 0) {
          this.state = 'GAME_OVER';
          audio.playGameOver();
        } else {
          // Reaparecer al inicio del nivel
          this.player.reset();
          this.player.invincibleTimer = 80;
        }
      }

      // 4. Actualizar Enemigos
      for (const enemy of this.level.enemies) {
        if (enemy.isDead) continue;

        if (enemy.type === 'turret') {
          enemy.update(this.level, this.projectiles);
        } else if (enemy.type === 'apex') {
          enemy.update(this.level, this.player, this.projectiles);
        } else {
          enemy.update(this.level);
        }

        // Colisión Jugador vs Enemigo
        if (this.player.intersects(enemy)) {
          // Stomp (Mario style): cae desde arriba sobre el enemigo
          if (this.player.vy > 0 && (this.player.y + this.player.h - this.player.vy) <= enemy.y + 14) {
            enemy.isDead = true;
            this.player.bounceOnEnemy();
            this.score += 200;
            this.particles.emit(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2, '#ffe600', 16, 3.5, 3, 30);
          } else {
            // Recibe daño
            if (this.player.hitHazard()) {
              break;
            }
          }
        }
      }

      // 5. Proyectiles
      for (let i = this.projectiles.length - 1; i >= 0; i--) {
        const p = this.projectiles[i];
        p.x += p.vx;
        // Colisión con jugador
        if (this.player.intersects(p)) {
          this.player.hitHazard();
          this.projectiles.splice(i, 1);
          continue;
        }
        // Desvanecer fuera de rango
        if (p.x < this.camX - 200 || p.x > this.camX + this.width + 200) {
          this.projectiles.splice(i, 1);
        }
      }

      // 6. Trampolines gravitacionales (Jump Pads)
      for (const pad of this.level.jumpPads) {
        if (this.player.intersects(pad)) {
          this.player.vy = pad.force;
          this.player.grounded = false;
          audio.playSpring();
          this.particles.emit(pad.x + pad.w / 2, pad.y, '#00ff66', 14, 4, 3, 25);
        }
      }

      // 7. Colisión con Peligros Ambientales (Pinchos, Ácido, Láser activo)
      for (const haz of this.level.hazards) {
        if (haz.type === 'laser' && !haz.active) continue;
        if (this.player.intersects(haz)) {
          this.player.hitHazard();
          break;
        }
      }

      // 8. Recolección de Cyber-Cores
      for (const core of this.level.cores) {
        if (!core.collected) {
          const coreRect = { x: core.x - 12, y: core.y - 12, w: 24, h: 24 };
          if (this.player.intersects(coreRect)) {
            core.collected = true;
            this.score += 100;
            audio.playCoin();
            this.particles.emit(core.x, core.y, '#00f0ff', 12, 3, 2.5, 25);
          }
        }
      }

      // 9. Portal de Fin de Nivel
      if (this.player.intersects(this.level.portal)) {
        audio.playLevelWin();
        if (this.currentLevelIdx < this.levels.length - 1) {
          this.state = 'LEVEL_WIN';
          this.transitionTimer = 110;
        } else {
          this.state = 'VICTORY';
        }
      }

      // 10. Suavizado de Cámara (Lerp Camera Follow)
      const targetCamX = this.player.x - this.width * 0.38;
      this.camX += (targetCamX - this.camX) * 0.09;
      this.camX = Math.max(0, Math.min(this.level.width - this.width, this.camX));

      const targetCamY = this.player.y - this.height * 0.55;
      this.camY += (targetCamY - this.camY) * 0.08;
      this.camY = Math.max(0, Math.min(this.level.height - this.height, this.camY));
    }

    if (this.state === 'LEVEL_WIN') {
      this.transitionTimer--;
      if (this.transitionTimer <= 0) {
        this.loadLevel(this.currentLevelIdx + 1);
        this.state = 'PLAYING';
      }
    }

    this.particles.update();
  }

  draw() {
    this.ctx.clearRect(0, 0, this.width, this.height);

    // Fondo Parallax Cyberpunk
    this.drawParallaxBackground();

    const camX = Math.round(this.camX);
    const camY = Math.round(this.camY);

    // Dibujar Plataformas
    const allPlatforms = [...this.level.platforms, ...this.level.movingPlatforms];
    for (const plat of allPlatforms) {
      if (plat.x + plat.w < camX || plat.x > camX + this.width) continue;

      const px = plat.x - camX;
      const py = plat.y - camY;

      this.ctx.save();
      if (plat.isMoving) {
        // Plataforma móvil con brillo cian pulsante
        this.ctx.fillStyle = '#0f172a';
        this.ctx.fillRect(px, py, plat.w, plat.h);
        this.ctx.strokeStyle = '#00f0ff';
        this.ctx.lineWidth = 2;
        this.ctx.shadowColor = '#00f0ff';
        this.ctx.shadowBlur = 8;
        this.ctx.strokeRect(px, py, plat.w, plat.h);

        // Flechas indicadoras de dirección
        this.ctx.fillStyle = '#00f0ff';
        this.ctx.fillRect(px + plat.w / 2 - 8, py + 8, 16, 4);
      } else if (plat.type === 'ground') {
        // Bloque de suelo con cuadrícula digital
        this.ctx.fillStyle = '#0d0c1d';
        this.ctx.fillRect(px, py, plat.w, plat.h);
        // Borde superior neón
        this.ctx.fillStyle = '#ff0055';
        this.ctx.shadowColor = '#ff0055';
        this.ctx.shadowBlur = 6;
        this.ctx.fillRect(px, py, plat.w, 4);
      } else {
        // Vigas metálicas suspendidas
        this.ctx.fillStyle = '#181b30';
        this.ctx.fillRect(px, py, plat.w, plat.h);
        this.ctx.fillStyle = '#00f0ff';
        this.ctx.fillRect(px, py, plat.w, 3);
      }
      this.ctx.restore();
    }

    // Dibujar Trampolines (Jump Pads)
    for (const pad of this.level.jumpPads) {
      const px = pad.x - camX;
      const py = pad.y - camY;
      this.ctx.save();
      this.ctx.fillStyle = '#00ff66';
      this.ctx.shadowColor = '#00ff66';
      this.ctx.shadowBlur = 10;
      this.ctx.fillRect(px, py + 6, pad.w, pad.h - 6);
      this.ctx.fillStyle = '#ffffff';
      this.ctx.fillRect(px + 4, py, pad.w - 8, 6);
      this.ctx.restore();
    }

    // Dibujar Peligros
    for (const haz of this.level.hazards) {
      const px = haz.x - camX;
      const py = haz.y - camY;

      this.ctx.save();
      if (haz.type === 'acid') {
        // Ácido tóxico burbujeante
        this.ctx.fillStyle = '#00ff66';
        this.ctx.shadowColor = '#00ff66';
        this.ctx.shadowBlur = 14;
        this.ctx.fillRect(px, py + 10, haz.w, haz.h);
        // Ondas en la superficie
        this.ctx.fillStyle = '#a6ffcb';
        for (let bx = 0; bx < haz.w; bx += 20) {
          const wave = Math.sin((Date.now() * 0.005) + bx) * 4;
          this.ctx.fillRect(px + bx, py + 8 + wave, 14, 4);
        }
      } else if (haz.type === 'spikes') {
        // Pinchos láser de energía
        this.ctx.fillStyle = '#ff0055';
        this.ctx.shadowColor = '#ff0055';
        this.ctx.shadowBlur = 10;
        const spikeW = 16;
        const count = Math.floor(haz.w / spikeW);
        for (let s = 0; s < count; s++) {
          this.ctx.beginPath();
          this.ctx.moveTo(px + s * spikeW, py + haz.h);
          this.ctx.lineTo(px + s * spikeW + spikeW / 2, py);
          this.ctx.lineTo(px + (s + 1) * spikeW, py + haz.h);
          this.ctx.fill();
        }
      } else if (haz.type === 'laser') {
        // Barrera de láser pulsante
        if (haz.active) {
          this.ctx.fillStyle = '#ff0055';
          this.ctx.shadowColor = '#ff0055';
          this.ctx.shadowBlur = 18;
          this.ctx.fillRect(px, py, haz.w, haz.h);
          this.ctx.fillStyle = '#ffffff';
          this.ctx.fillRect(px + 2, py, haz.w - 4, haz.h);
        } else {
          // Guía desactivada
          this.ctx.fillStyle = 'rgba(255, 0, 85, 0.15)';
          this.ctx.fillRect(px + 3, py, 2, haz.h);
        }
      }
      this.ctx.restore();
    }

    // Dibujar Cores (Coleccionables)
    const time = Date.now() * 0.004;
    for (const core of this.level.cores) {
      if (core.collected) continue;
      const px = core.x - camX;
      const py = core.y - camY + Math.sin(time + core.x) * 4;

      this.ctx.save();
      this.ctx.translate(px, py);
      this.ctx.rotate(time * 0.8);
      this.ctx.fillStyle = '#00f0ff';
      this.ctx.shadowColor = '#00f0ff';
      this.ctx.shadowBlur = 12;
      // Diamante de datos
      this.ctx.fillRect(-8, -8, 16, 16);
      this.ctx.fillStyle = '#ffffff';
      this.ctx.fillRect(-4, -4, 8, 8);
      this.ctx.restore();
    }

    // Dibujar Portal de Salida
    const p = this.level.portal;
    const portalX = p.x - camX;
    const portalY = p.y - camY;
    this.ctx.save();
    this.ctx.shadowColor = '#00f0ff';
    this.ctx.shadowBlur = 20;
    this.ctx.strokeStyle = '#00f0ff';
    this.ctx.lineWidth = 3;
    // Anillos concéntricos giratorios
    this.ctx.strokeRect(portalX, portalY, p.w, p.h);
    this.ctx.fillStyle = 'rgba(0, 240, 255, 0.15)';
    this.ctx.fillRect(portalX, portalY, p.w, p.h);
    // Vórtice central
    this.ctx.fillStyle = '#ff0055';
    this.ctx.shadowColor = '#ff0055';
    const portalPulse = Math.sin(time * 2) * 6;
    this.ctx.fillRect(portalX + 8, portalY + 12 + portalPulse / 2, p.w - 16, p.h - 24 - portalPulse);
    this.ctx.restore();

    // Dibujar Enemigos
    for (const enemy of this.level.enemies) {
      if (!enemy.isDead) {
        enemy.draw(this.ctx, camX, camY);
      }
    }

    // Dibujar Proyectiles
    for (const proj of this.projectiles) {
      this.ctx.save();
      this.ctx.fillStyle = proj.color;
      this.ctx.shadowColor = proj.color;
      this.ctx.shadowBlur = 10;
      this.ctx.fillRect(proj.x - camX, proj.y - camY, proj.w, proj.h);
      this.ctx.restore();
    }

    // Dibujar Jugador
    this.player.draw(this.ctx, camX, camY);

    // Dibujar Partículas
    this.particles.draw(this.ctx, camX, camY);

    // HUD (Interfaz de Usuario)
    this.drawHUD();

    // Pantallas de Estado
    if (this.state === 'START') this.drawStartScreen();
    if (this.state === 'LEVEL_WIN') this.drawLevelWinBanner();
    if (this.state === 'GAME_OVER') this.drawGameOverScreen();
    if (this.state === 'VICTORY') this.drawVictoryScreen();
  }

  drawParallaxBackground() {
    // Fondo de gradiente oscuro
    const grad = this.ctx.createLinearGradient(0, 0, 0, this.height);
    grad.addColorStop(0, '#060511');
    grad.addColorStop(1, '#180c29');
    this.ctx.fillStyle = grad;
    this.ctx.fillRect(0, 0, this.width, this.height);

    // Capa de edificios distantes (Parallax 0.15x)
    this.ctx.save();
    this.ctx.fillStyle = '#0b0a1f';
    const bOffset = (this.camX * 0.15) % 220;
    for (let x = -bOffset - 50; x < this.width + 100; x += 110) {
      const h = 180 + ((Math.sin(x) * 1000) % 90);
      this.ctx.fillRect(x, this.height - h, 90, h);
      // Ventanas de los rascacielos
      this.ctx.fillStyle = 'rgba(0, 240, 255, 0.12)';
      for (let wy = this.height - h + 20; wy < this.height - 20; wy += 25) {
        this.ctx.fillRect(x + 15, wy, 8, 12);
        this.ctx.fillRect(x + 40, wy, 8, 12);
        this.ctx.fillRect(x + 65, wy, 8, 12);
      }
      this.ctx.fillStyle = '#0b0a1f';
    }

    // Capa de siluetas intermedias (Parallax 0.35x)
    this.ctx.fillStyle = '#120f2b';
    const mOffset = (this.camX * 0.35) % 300;
    for (let x = -mOffset - 60; x < this.width + 100; x += 150) {
      const h = 100 + ((Math.cos(x) * 1000) % 60);
      this.ctx.fillRect(x, this.height - h, 120, h);
    }
    this.ctx.restore();
  }

  drawHUD() {
    this.ctx.save();
    this.ctx.font = 'bold 15px "Segoe UI", sans-serif';

    // Panel superior translúcido
    this.ctx.fillStyle = 'rgba(9, 8, 20, 0.75)';
    this.ctx.fillRect(15, 12, 380, 40);
    this.ctx.strokeStyle = '#00f0ff';
    this.ctx.lineWidth = 1.5;
    this.ctx.strokeRect(15, 12, 380, 40);

    // Vidas (Baterías Cibernéticas)
    this.ctx.fillStyle = '#ff0055';
    this.ctx.shadowColor = '#ff0055';
    this.ctx.shadowBlur = 6;
    this.ctx.fillText('VIDAS:', 28, 37);
    for (let i = 0; i < 3; i++) {
      if (i < this.lives) {
        this.ctx.fillStyle = '#ff0055';
        this.ctx.fillRect(85 + i * 22, 24, 15, 16);
      } else {
        this.ctx.strokeStyle = 'rgba(255, 0, 85, 0.4)';
        this.ctx.strokeRect(85 + i * 22, 24, 15, 16);
      }
    }

    // Puntuación
    this.ctx.fillStyle = '#00f0ff';
    this.ctx.shadowColor = '#00f0ff';
    this.ctx.fillText(`SCORE: ${this.score}`, 170, 37);

    // Nivel
    this.ctx.fillStyle = '#ffe600';
    this.ctx.shadowColor = '#ffe600';
    this.ctx.fillText(`NIVEL ${this.currentLevelIdx + 1}/5`, 295, 37);

    // Indicador de Sonido
    this.ctx.fillStyle = audio.muted ? '#ff0055' : '#00ff66';
    this.ctx.shadowColor = audio.muted ? '#ff0055' : '#00ff66';
    this.ctx.font = 'bold 12px "Segoe UI", sans-serif';
    this.ctx.fillText(audio.muted ? '[M: MUTED]' : '[M: AUDIO ON]', this.width - 110, 37);

    this.ctx.restore();
  }

  drawStartScreen() {
    this.ctx.save();
    this.ctx.fillStyle = 'rgba(6, 5, 16, 0.88)';
    this.ctx.fillRect(0, 0, this.width, this.height);

    // Título Principal
    this.ctx.textAlign = 'center';
    this.ctx.font = '900 48px "Segoe UI", sans-serif';
    this.ctx.fillStyle = '#00f0ff';
    this.ctx.shadowColor = '#00f0ff';
    this.ctx.shadowBlur = 25;
    this.ctx.fillText('CYBER SURGE', this.width / 2, 170);

    this.ctx.font = '700 22px "Segoe UI", sans-serif';
    this.ctx.fillStyle = '#ff0055';
    this.ctx.shadowColor = '#ff0055';
    this.ctx.shadowBlur = 15;
    this.ctx.fillText('PROTOCOL ZERO: 5 SECTORES', this.width / 2, 215);

    // Instrucciones
    this.ctx.font = '16px "Segoe UI", sans-serif';
    this.ctx.fillStyle = '#e2e8f0';
    this.ctx.shadowBlur = 0;
    this.ctx.fillText('Supera los 5 niveles, destruye drones pisándolos y alcanza el portal.', this.width / 2, 290);
    this.ctx.fillText('Nivel 1: Drones de patrulla | Nivel 2: Acid Foundry | Nivel 3: Láseres & Torretas', this.width / 2, 320);
    this.ctx.fillText('Nivel 4: Avispones & Jump Pads | Nivel 5: Apex Sentinels', this.width / 2, 345);

    // Indicador de modo de controles
    this.ctx.font = '14px "Segoe UI", sans-serif';
    this.ctx.fillStyle = '#ffe600';
    this.ctx.shadowColor = '#ffe600';
    this.ctx.shadowBlur = 6;
    const modeText = this.controlsInverted
      ? 'MANDOS TÁCTILES: [ ▲ SALTO (IZQ) ]  [ ◀ ▶ MOVIMIENTO (DER) ]  (PULSA ⇄ O "I")'
      : 'MANDOS TÁCTILES: [ ◀ ▶ MOVIMIENTO (IZQ) ]  [ ▲ SALTO (DER) ]  (PULSA ⇄ O "I")';
    this.ctx.fillText(modeText, this.width / 2, 385);

    // Pulsador "PRESIONA CUALQUIER TECLA"
    const pulse = Math.abs(Math.sin(Date.now() * 0.004));
    this.ctx.font = 'bold 20px "Segoe UI", sans-serif';
    this.ctx.fillStyle = `rgba(0, 240, 255, ${0.4 + pulse * 0.6})`;
    this.ctx.shadowColor = '#00f0ff';
    this.ctx.shadowBlur = 12;
    this.ctx.fillText('>>> PRESIONA CUALQUIER TECLA O HAZ CLIC PARA INICIAR <<<', this.width / 2, 435);

    this.ctx.restore();
  }

  drawLevelWinBanner() {
    this.ctx.save();
    this.ctx.fillStyle = 'rgba(6, 5, 16, 0.7)';
    this.ctx.fillRect(0, this.height / 2 - 60, this.width, 120);

    this.ctx.textAlign = 'center';
    this.ctx.font = 'bold 36px "Segoe UI", sans-serif';
    this.ctx.fillStyle = '#00ff66';
    this.ctx.shadowColor = '#00ff66';
    this.ctx.shadowBlur = 18;
    this.ctx.fillText('¡SECTOR COMPLETADO!', this.width / 2, this.height / 2);

    this.ctx.font = '18px "Segoe UI", sans-serif';
    this.ctx.fillStyle = '#00f0ff';
    this.ctx.shadowColor = '#00f0ff';
    this.ctx.shadowBlur = 8;
    this.ctx.fillText('CARGANDO SIGUIENTE SECTOR...', this.width / 2, this.height / 2 + 35);
    this.ctx.restore();
  }

  drawGameOverScreen() {
    this.ctx.save();
    this.ctx.fillStyle = 'rgba(6, 5, 16, 0.92)';
    this.ctx.fillRect(0, 0, this.width, this.height);

    this.ctx.textAlign = 'center';
    this.ctx.font = '900 52px "Segoe UI", sans-serif';
    this.ctx.fillStyle = '#ff0055';
    this.ctx.shadowColor = '#ff0055';
    this.ctx.shadowBlur = 24;
    this.ctx.fillText('SISTEMA COLAPSADO', this.width / 2, 220);

    this.ctx.font = '20px "Segoe UI", sans-serif';
    this.ctx.fillStyle = '#00f0ff';
    this.ctx.shadowBlur = 6;
    this.ctx.fillText(`PUNTUACIÓN FINAL: ${this.score}`, this.width / 2, 275);

    this.ctx.font = 'bold 20px "Segoe UI", sans-serif';
    this.ctx.fillStyle = '#ffe600';
    this.ctx.fillText('PRESIONA [ R ] O HAZ CLIC PARA REINICIAR', this.width / 2, 350);
    this.ctx.restore();
  }

  drawVictoryScreen() {
    this.ctx.save();
    this.ctx.fillStyle = 'rgba(6, 5, 16, 0.94)';
    this.ctx.fillRect(0, 0, this.width, this.height);

    this.ctx.textAlign = 'center';
    this.ctx.font = '900 50px "Segoe UI", sans-serif';
    this.ctx.fillStyle = '#00ff66';
    this.ctx.shadowColor = '#00ff66';
    this.ctx.shadowBlur = 25;
    this.ctx.fillText('¡PROTOCOLO ZERO COMPLETADO!', this.width / 2, 200);

    this.ctx.font = '22px "Segoe UI", sans-serif';
    this.ctx.fillStyle = '#00f0ff';
    this.ctx.shadowColor = '#00f0ff';
    this.ctx.shadowBlur = 10;
    this.ctx.fillText('Has liberado todos los sectores de la red central.', this.width / 2, 255);

    this.ctx.font = 'bold 24px "Segoe UI", sans-serif';
    this.ctx.fillStyle = '#ffe600';
    this.ctx.fillText(`PUNTUACIÓN TOTAL: ${this.score}`, this.width / 2, 310);

    this.ctx.font = 'bold 18px "Segoe UI", sans-serif';
    this.ctx.fillStyle = '#ffffff';
    this.ctx.fillText('PRESIONA [ R ] O HAZ CLIC PARA VOLVER A JUGAR', this.width / 2, 385);
    this.ctx.restore();
  }

  loop(currentTime) {
    this.update();
    this.draw();
    requestAnimationFrame(this.loop);
  }
}

// Inicializar el juego al cargar la página
window.addEventListener('load', () => {
  new Game();
});
</script>
</body>
