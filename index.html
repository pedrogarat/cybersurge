<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CYBER SURGE: PROTOCOL ZERO - Retro 2D Platformer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05050d;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #00f0ff;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 960px;
      height: 540px;
      max-width: 100vw;
      max-height: 100vh;
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.35), 0 0 70px rgba(255, 0, 85, 0.2);
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #00f0ff;
      background: #090814;
    }
    /* Escalado responsivo en dispositivos móviles */
    @media (max-width: 980px), (max-height: 560px) {
      #game-container {
        width: 100vw;
        height: 56.25vw; /* ratio 16:9 */
        max-height: 100vh;
        max-width: 177.78vh;
        border-radius: 0;
        border-left: none;
        border-right: none;
      }
      #instructions-bar {
        display: none !important;
      }
    }
    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
    }
    .vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.25);
      pointer-events: none;
      z-index: 11;
    }
    #instructions-bar {
      margin-top: 10px;
      font-size: 13px;
      color: #a4b3d6;
      display: flex;
      gap: 20px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    #instructions-bar span {
      color: #00f0ff;
      font-weight: bold;
    }

    /* =========================================
       CONTROLES TÁCTILES PARA MÓVIL (CYBER HUD)
       ========================================= */
    #mobile-controls {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 30;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 16px;
    }
    .mobile-top-bar {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .mobile-bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
      padding-bottom: 6px;
    }
    /* Inversión de mandos (Salto izquierda, movimiento derecha) */
    .mobile-bottom-bar.layout-inverted {
      flex-direction: row-reverse;
    }
    .touch-btn {
      pointer-events: auto;
      touch-action: none;
      background: rgba(16, 12, 38, 0.7);
      border: 2px solid #00f0ff;
      color: #00f0ff;
      border-radius: 12px;
      font-family: inherit;
      font-weight: 800;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.4), inset 0 0 10px rgba(0, 240, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s ease, background 0.08s ease;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    .touch-btn:active, .touch-btn.active {
      background: rgba(0, 240, 255, 0.45);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.8), inset 0 0 14px rgba(0, 240, 255, 0.5);
      transform: scale(0.92);
    }
    .touch-btn-small {
      padding: 6px 12px;
      font-size: 11px;
      letter-spacing: 1px;
      border-radius: 8px;
      border-color: #a4b3d6;
      color: #e2e8f0;
    }
    .touch-dpad {
      display: flex;
      gap: 14px;
    }
    .touch-dir {
      width: 66px;
      height: 66px;
      font-size: 26px;
      border-radius: 50%;
    }
    .touch-jump {
      width: 80px;
      height: 80px;
      font-size: 13px;
      border-radius: 50%;
      border-color: #ff0055;
      color: #ff0055;
      box-shadow: 0 0 16px rgba(255, 0, 85, 0.5), inset 0 0 12px rgba(255, 0, 85, 0.25);
    }
    .touch-jump:active, .touch-jump.active {
      background: rgba(255, 0, 85, 0.45);
      box-shadow: 0 0 24px rgba(255, 0, 85, 0.9), inset 0 0 18px rgba(255, 0, 85, 0.6);
      transform: scale(0.92);
    }

    @media (hover: hover) and (pointer: fine) and (min-width: 981px) {
      body:not(.touch-enabled) #mobile-controls {
        display: none;
      }
    }

    /* Aviso de rotación para móvil */
    #orientation-warning {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 5, 13, 0.95);
      z-index: 999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #00f0ff;
      font-weight: 800;
      font-size: 18px;
      padding: 24px;
    }
    .orient-icon {
      font-size: 46px;
      margin-bottom: 14px;
      animation: rotatePhone 2.2s infinite ease-in-out;
    }
    @keyframes rotatePhone {
      0% { transform: rotate(0deg); }
      40% { transform: rotate(90deg); }
      70% { transform: rotate(90deg); }
      100% { transform: rotate(0deg); }
    }
    @media screen and (orientation: portrait) and (max-width: 768px) {
      #orientation-warning {
        display: flex;
      }
    }
  </style>

<body>

<script>
/**
 * CYBER SURGE: PROTOCOL ZERO
 * Edición 2D Clásica Arcade - Con el Sacerdote y lanzamiento de sombrero teledirigido
 */

// ==========================================
// 1. SISTEMA DE AUDIO PROCEDURAL (WEB AUDIO)
// ==========================================
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.muted = false;
    this.bgmTimer = null;
    this.currentStep = 0;
    this.tempo = 120;
    this.currentLevel = 1;
    this.masterGain = null;
    this.scales = {
      1: { root: 220, notes: [0, 3, 5, 7, 10, 12, 15, 17] }, // Am pentatónica
      2: { root: 146.83, notes: [0, 2, 3, 5, 7, 9, 10, 12] },    // D dorian
      3: { root: 174.61, notes: [0, 1, 3, 5, 7, 8, 10, 12] },  // F phrygian
      4: { root: 164.81, notes: [0, 2, 3, 5, 7, 8, 10, 12] },   // E aeolian
      5: { root: 130.81, notes: [0, 1, 4, 5, 7, 8, 11, 12] } // C double harmonic
    };
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.setValueAtTime(0.22, this.ctx.currentTime);
      this.masterGain.connect(this.ctx.destination);
      this.startBGM();
    } else if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  toggleMute() {
    this.muted = !this.muted;
    if (this.masterGain) {
      this.masterGain.gain.setValueAtTime(this.muted ? 0 : 0.22, this.ctx.currentTime);
    }
    return this.muted;
  }

  playTone(freq, type, duration, startVol = 0.3, endVol = 0.001) {
    if (this.muted || !this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(startVol, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(endVol, this.ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    } catch (e) {}
  }

  playJump() {
    if (this.muted || !this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      const now = this.ctx.currentTime;
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.exponentialRampToValueAtTime(540, now + 0.16);
      gain.gain.setValueAtTime(0.28, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start(now);
      osc.stop(now + 0.17);
    } catch (e) {}
  }

  playCoin() {
    if (this.muted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(987.77, now);
      osc.frequency.setValueAtTime(1318.51, now + 0.08);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start(now);
      osc.stop(now + 0.23);
    } catch (e) {}
  }

  playStomp() {
    if (this.muted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(45, now + 0.18);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start(now);
      osc.stop(now + 0.19);
    } catch (e) {}
  }

  playHurt() {
    if (this.muted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(450, now);
      osc.frequency.linearRampToValueAtTime(80, now + 0.3);
      gain.gain.setValueAtTime(0.45, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start(now);
      osc.stop(now + 0.31);
    } catch (e) {}
  }

  playSpring() {
    if (this.muted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.exponentialRampToValueAtTime(750, now + 0.25);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start(now);
      osc.stop(now + 0.26);
    } catch (e) {}
  }

  playLaser() {
    if (this.muted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(900, now);
      osc.frequency.exponentialRampToValueAtTime(150, now + 0.12);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start(now);
      osc.stop(now + 0.13);
    } catch (e) {}
  }

  playHatThrow() {
    if (this.muted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(420, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start(now);
      osc.stop(now + 0.16);
    } catch (e) {}
  }

  playHatHit() {
    if (this.muted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(550, now);
      osc.frequency.setValueAtTime(740, now + 0.06);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start(now);
      osc.stop(now + 0.19);
    } catch (e) {}
  }

  playLevelWin() {
    if (this.muted || !this.ctx) return;
    const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
    notes.forEach((freq, idx) => {
      setTimeout(() => {
        this.playTone(freq, 'square', 0.18, 0.32);
      }, idx * 110);
    });
  }

  playGameOver() {
    if (this.muted || !this.ctx) return;
    const notes = [440, 415.3, 392, 349.23];
    notes.forEach((freq, idx) => {
      setTimeout(() => {
        this.playTone(freq, 'sawtooth', 0.28, 0.3);
      }, idx * 180);
    });
  }

  setLevel(levelIndex) {
    this.currentLevel = levelIndex;
    this.tempo = 112 + (levelIndex * 9);
    if (this.bgmTimer) {
      clearInterval(this.bgmTimer);
      this.startBGM();
    }
  }

  startBGM() {
    if (this.bgmTimer) clearInterval(this.bgmTimer);
    const stepInterval = (60 / this.tempo / 4) * 1000;

    this.bgmTimer = setInterval(() => {
      if (this.muted || !this.ctx || this.ctx.state !== 'running') return;
      
      const scaleData = this.scales[this.currentLevel] || this.scales[1];
      const step = this.currentStep % 16;
      const root = scaleData.root;
      const notes = scaleData.notes;

      if (step % 2 === 0) {
        const bassNoteIdx = [0, 0, 3, 0, 4, 0, 2, 0][Math.floor(step / 2)];
        const bassFreq = root * Math.pow(2, (notes[bassNoteIdx % notes.length] - 12) / 12);
        this.playTone(bassFreq, 'triangle', 0.12, 0.28);
      }

      if (step % 2 === 1 || step === 0 || step === 8) {
        const arpIdx = (step * 3 + this.currentLevel) % notes.length;
        const arpFreq = root * Math.pow(2, (notes[arpIdx] + 12) / 12);
        this.playTone(arpFreq, 'square', 0.08, 0.09);
      }

      if (step % 4 === 2) {
        this.playTone(3200 + Math.random() * 800, 'sawtooth', 0.03, 0.05);
      }

      this.currentStep++;
    }, stepInterval);
  }
}

const audio = new SoundEngine();

// ==========================================
// 2. MOTOR DE PARTÍCULAS
// ==========================================
class ParticleSystem {
  constructor() {
    this.particles = [];
  }

  emit(x, y, color, count = 8, speed = 3, size = 3, life = 35) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const spd = (Math.random() * 0.7 + 0.3) * speed;
      this.particles.push({
        x, y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd,
        color,
        size: Math.random() * size + 1.5,
        maxLife: life,
        life: life
      });
    }
  }

  update() {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.08;
      p.life--;
      if (p.life <= 0) {
        this.particles.splice(i, 1);
      }
    }
  }

  draw(ctx, camX, camY) {
    for (const p of this.particles) {
      const alpha = Math.max(0, p.life / p.maxLife);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.fillRect(p.x - camX, p.y - camY, p.size, p.size);
      ctx.restore();
    }
  }
}

// ==========================================
// 3. JUGADOR CON FÍSICAS FLUIDAS (AABB)
// ==========================================
class Player {
  constructor(x, y) {
    this.spawnX = x;
    this.spawnY = y;
    this.reset();
  }

  reset() {
    this.x = this.spawnX;
    this.y = this.spawnY;
    this.w = 34; // Personaje ampliado de tamaño para máxima visibilidad y presencia
    this.h = 54;
    this.vx = 0;
    this.vy = 0;
    this.grounded = false;
    this.currentPlat = null;
    this.facing = 1;
    this.coyoteTimer = 0;
    this.jumpBuffer = 0;
    this.runAnimTimer = 0;
    this.invincibleTimer = 0;
    this.isDead = false;
    this.afterImages = [];
    this.hasHat = true; // El sombrero está puesto hasta que se lanza
  }

  update(input, level, particles) {
    if (this.isDead) return;

    if (this.invincibleTimer > 0) this.invincibleTimer--;

    const accel = 0.85;
    const maxSpeed = 5.6;
    const friction = this.grounded ? 0.78 : 0.88;

    if (input.left) {
      this.vx -= accel;
      this.facing = -1;
    } else if (input.right) {
      this.vx += accel;
      this.facing = 1;
    } else {
      this.vx *= friction;
      if (Math.abs(this.vx) < 0.1) this.vx = 0;
    }
    this.vx = Math.max(-maxSpeed, Math.min(maxSpeed, this.vx));

    if (Math.abs(this.vx) > 3.8 && Math.random() < 0.35) {
      this.afterImages.push({
        x: this.x,
        y: this.y,
        alpha: 0.5
      });
    }

    const gravity = 0.46;
    const maxFall = 11;
    this.vy += gravity;
    if (this.vy > maxFall) this.vy = maxFall;

    if (this.grounded) {
      this.coyoteTimer = 6;
    } else if (this.coyoteTimer > 0) {
      this.coyoteTimer--;
    }

    if (input.jumpPressed) {
      this.jumpBuffer = 6;
      input.jumpPressed = false;
    } else if (this.jumpBuffer > 0) {
      this.jumpBuffer--;
    }

    if (this.jumpBuffer > 0 && this.coyoteTimer > 0) {
      this.vy = -10.8;
      this.grounded = false;
      this.coyoteTimer = 0;
      this.jumpBuffer = 0;
      audio.playJump();
      particles.emit(this.x + this.w / 2, this.y + this.h, '#00f0ff', 10, 2.5, 2.5, 20);
    }

    if (!input.jump && this.vy < -3.5) {
      this.vy *= 0.65;
    }

    if (this.currentPlat && this.currentPlat.isMoving) {
      this.x += (this.currentPlat.vx || 0);
      this.y += (this.currentPlat.vy || 0);
    }

    this.x += this.vx;
    this.resolveCollisionsX(level);

    this.grounded = false;
    this.currentPlat = null;
    this.y += this.vy;
    this.resolveCollisionsY(level, particles);

    if (this.grounded && Math.abs(this.vx) > 0.5) {
      this.runAnimTimer += 0.22;
      if (Math.random() < 0.15) {
        particles.emit(this.x + (this.facing > 0 ? 4 : this.w - 4), this.y + this.h, '#ff0055', 2, 1, 2, 15);
      }
    } else if (this.grounded) {
      this.runAnimTimer = 0;
    }

    if (this.y > level.height + 150) {
      this.die();
    }

    for (let i = this.afterImages.length - 1; i >= 0; i--) {
      this.afterImages[i].alpha -= 0.05;
      if (this.afterImages[i].alpha <= 0) {
        this.afterImages.splice(i, 1);
      }
    }
  }

  resolveCollisionsX(level) {
    const allPlats = [...level.platforms, ...level.movingPlatforms];
    for (const plat of allPlats) {
      if (this.intersects(plat)) {
        // Si el jugador está claramente parado encima o muy cerca de la superficie, no colisionar horizontalmente
        if (this.y + this.h <= plat.y + 7) continue;

        const overlapLeft = (this.x + this.w) - plat.x;
        const overlapRight = (plat.x + plat.w) - this.x;
        if (overlapLeft < overlapRight) {
          this.x = plat.x - this.w;
          if (this.vx > 0) this.vx = 0;
        } else {
          this.x = plat.x + plat.w;
          if (this.vx < 0) this.vx = 0;
        }
      }
    }
  }

  resolveCollisionsY(level, particles) {
    const allPlats = [...level.platforms, ...level.movingPlatforms];
    for (const plat of allPlats) {
      if (this.intersects(plat)) {
        if (this.vy >= 0 && (this.y + this.h - this.vy <= plat.y + 12 || this.y + this.h >= plat.y)) {
          this.y = plat.y - this.h;
          this.vy = 0;
          if (!this.grounded) {
            particles.emit(this.x + this.w / 2, this.y + this.h, '#00f0ff', 6, 2, 2, 15);
          }
          this.grounded = true;
          this.currentPlat = plat;
        } else if (this.vy < 0) {
          this.y = plat.y + plat.h;
          this.vy = 0;
        }
      }
    }
  }

  intersects(rect) {
    return (
      this.x < rect.x + rect.w &&
      this.x + this.w > rect.x &&
      this.y < rect.y + rect.h &&
      this.y + this.h > rect.y
    );
  }

  bounceOnEnemy() {
    this.vy = -9.5;
    this.coyoteTimer = 0;
    audio.playStomp();
  }

  hitHazard() {
    if (this.invincibleTimer > 0) return false;
    this.die();
    return true;
  }

  die() {
    if (this.isDead) return;
    this.isDead = true;
    audio.playHurt();
  }

  draw(ctx, camX, camY) {
    if (this.invincibleTimer > 0 && Math.floor(this.invincibleTimer / 4) % 2 === 0) {
      return;
    }

    // Efecto de aura / bendición protectora (dash o velocidad alta)
    for (const img of this.afterImages) {
      ctx.save();
      ctx.globalAlpha = img.alpha * 0.45;
      ctx.fillStyle = '#ffe600';
      ctx.shadowColor = '#ffe600';
      ctx.shadowBlur = 10;
      ctx.fillRect(img.x - camX, img.y - camY, this.w, this.h);
      ctx.restore();
    }

    const px = Math.round(this.x - camX);
    const py = Math.round(this.y - camY);

    ctx.save();
    if (this.facing === -1) {
      ctx.translate(px + this.w, py);
      ctx.scale(-1, 1);
    } else {
      ctx.translate(px, py);
    }

    // Factores dinámicos de animación
    const isJumping = !this.grounded;
    const isAscending = isJumping && this.vy < 0;
    const isFalling = isJumping && this.vy >= 0;
    const isRunning = this.grounded && Math.abs(this.vx) > 0.5;
    const runCycle = this.runAnimTimer;
    const timeSec = Date.now() * 0.005;

    // Resplandor áureo sagrado de contraste
    ctx.shadowColor = '#ffe600';
    ctx.shadowBlur = 12;

    // --- 1. CAPA / MANTO NEGRO CON FORRO DE ORO SACRO (Detrás) ---
    ctx.save();
    ctx.fillStyle = '#0f172a'; // Sotana/manto exterior negro noche
    ctx.shadowColor = '#000000';
    ctx.shadowBlur = 8;
    if (isAscending) {
      // Al saltar hacia arriba, el manto ondea hacia abajo y hacia atrás
      ctx.beginPath();
      ctx.moveTo(8, 20);
      ctx.quadraticCurveTo(-10, 32 + Math.sin(timeSec * 3) * 4, -22, 48);
      ctx.lineTo(-15, 54);
      ctx.quadraticCurveTo(-5, 36, 12, 28);
      ctx.closePath();
      ctx.fill();
      // Borde dorado
      ctx.strokeStyle = '#ffe600';
      ctx.lineWidth = 2;
      ctx.stroke();
    } else if (isFalling) {
      // Al caer, el manto se infla hacia arriba por la resistencia del aire
      ctx.beginPath();
      ctx.moveTo(8, 20);
      ctx.quadraticCurveTo(-14, 10 + Math.sin(timeSec * 3) * 4, -24, 4);
      ctx.lineTo(-18, -2);
      ctx.quadraticCurveTo(-6, 12, 12, 26);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#ffe600';
      ctx.lineWidth = 2;
      ctx.stroke();
    } else if (isRunning) {
      // Al correr, el manto vuela elegantemente
      const capeWave1 = Math.sin(runCycle * 2) * 6;
      const capeWave2 = Math.cos(runCycle * 2) * 7;
      ctx.beginPath();
      ctx.moveTo(8, 20);
      ctx.quadraticCurveTo(-10, 20 + capeWave1, -22, 26 + capeWave2);
      ctx.lineTo(-18, 38 + capeWave2);
      ctx.quadraticCurveTo(-8, 30 + capeWave1, 12, 32);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#ffe600';
      ctx.lineWidth = 1.6;
      ctx.stroke();
    } else {
      // En reposo (idle)
      const breath = Math.sin(timeSec * 1.5) * 2.5;
      ctx.fillRect(-6, 20 + breath, 10, 24);
      ctx.fillStyle = '#ffe600';
      ctx.fillRect(-7, 42 + breath, 11, 2.5);
    }
    ctx.restore();

    // --- 2. PIERNAS, FALDÓN DE LA SOTANA Y ZAPATOS SACERDOTALES ---
    ctx.save();
    ctx.fillStyle = '#0f172a';
    if (isAscending) {
      // Pierna trasera estirada, delantera recogida
      ctx.fillRect(5, 33, 9, 16);
      ctx.fillRect(20, 30, 9, 12);
      // Zapatos negros de cuero con hebilla dorada
      ctx.fillStyle = '#020617';
      ctx.fillRect(4, 49, 11, 5);
      ctx.fillRect(21, 42, 11, 5);
      ctx.fillStyle = '#ffe600';
      ctx.fillRect(7, 50, 4, 3);
      ctx.fillRect(24, 43, 4, 3);
    } else if (isFalling) {
      // Piernas amortiguando
      ctx.fillRect(5, 34, 9, 16);
      ctx.fillRect(20, 34, 9, 16);
      ctx.fillStyle = '#020617';
      ctx.fillRect(4, 50, 11, 4);
      ctx.fillRect(20, 50, 11, 4);
      ctx.fillStyle = '#ffe600';
      ctx.fillRect(7, 51, 4, 2);
      ctx.fillRect(23, 51, 4, 2);
    } else if (isRunning) {
      // Zancada sacerdotal fluida
      const stepSwing = Math.sin(runCycle) * 8;
      ctx.fillRect(5 + stepSwing, 34, 9, 16);
      ctx.fillRect(20 - stepSwing, 34, 9, 16);
      ctx.fillStyle = '#020617';
      ctx.fillRect(4 + stepSwing, 50, 11, 4);
      ctx.fillRect(19 - stepSwing, 50, 11, 4);
      ctx.fillStyle = '#ffe600';
      ctx.fillRect(7 + stepSwing, 51, 4, 2);
      ctx.fillRect(22 - stepSwing, 51, 4, 2);
    } else {
      // Reposo
      const idleBob = Math.sin(timeSec * 2) * 1.2;
      ctx.fillRect(5, 34 + idleBob, 9, 16);
      ctx.fillRect(20, 34 + idleBob, 9, 16);
      ctx.fillStyle = '#020617';
      ctx.fillRect(4, 50 + idleBob, 11, 4);
      ctx.fillRect(19, 50 + idleBob, 11, 4);
      ctx.fillStyle = '#ffe600';
      ctx.fillRect(7, 51 + idleBob, 4, 2);
      ctx.fillRect(22, 51 + idleBob, 4, 2);
    }
    ctx.restore();

    // --- 3. CUERPO: SOTANA NEGRA, BOTONADURA CENTRAL Y ALZACUELLOS BLANCO ---
    const torsoY = isRunning ? 17 + Math.abs(Math.sin(runCycle)) * 2 : (isJumping ? 14 : 17);
    ctx.save();
    // Cuerpo de la sotana negra
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(4, torsoY, 26, 19);
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(4, torsoY, 26, 19);

    // Botonadura frontal vertical de la sotana
    ctx.fillStyle = '#000000';
    ctx.fillRect(16, torsoY + 2, 2.5, 17);
    ctx.fillStyle = '#ffffff';
    for (let b = 0; b < 5; b++) {
      ctx.fillRect(16, torsoY + 3 + b * 3.5, 2.5, 1.2);
    }

    // Faja / Cíngulo negro con caída
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(3, torsoY + 14, 28, 4);
    ctx.fillStyle = '#ffe600'; // Detalle dorado del cíngulo
    ctx.fillRect(13, torsoY + 14, 8, 4);
    ctx.fillRect(15, torsoY + 18, 5, 8);

    // Pectoral / Cruz de oro bendita en el pecho
    ctx.fillStyle = '#ffe600';
    ctx.shadowColor = '#ffe600';
    ctx.shadowBlur = 10;
    ctx.fillRect(9, torsoY + 5, 4, 8);
    ctx.fillRect(6, torsoY + 7, 10, 2.5);
    ctx.restore();

    // Cuello negro con clériman / ALZACUELLOS blanco característico
    ctx.save();
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(8, torsoY - 3, 18, 5);
    // Alzacuellos blanco inconfundible
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 8;
    ctx.fillRect(13, torsoY - 3, 8, 4);
    ctx.restore();

    // --- 4. BRAZOS CON MANGA ANCHA Y MANOS ---
    ctx.save();
    const armSwing = isRunning ? Math.sin(runCycle) * 6 : (isAscending ? -5 : (isFalling ? 4 : 0));
    // Manga negra
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(8 - armSwing * 0.4, torsoY + 1, 8, 15);
    // Puño blanco de la camisa
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(8 - armSwing * 0.4, torsoY + 14, 8, 2.5);
    // Mano color piel
    ctx.fillStyle = '#fbcfe8';
    ctx.fillRect(9 - armSwing * 0.4, torsoY + 16.5, 6.5, 5);
    ctx.restore();

    // --- 5. CABEZA, RASGOS FACIALES Y GAFAS REDONDAS (Fiel a la foto) ---
    const headY = torsoY - 17;
    ctx.save();

    // Tono de piel sonrosado/claro realista
    ctx.fillStyle = '#fbeee6';
    // Cráneo con frente ancha y despejada
    ctx.beginPath();
    ctx.ellipse(17, headY + 8, 11, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // Cabello lateral oscuro (calvicie superior pronunciada)
    ctx.fillStyle = '#262626';
    // Mechones laterales sienes y coronilla baja
    ctx.beginPath();
    ctx.arc(8, headY + 9, 5, Math.PI * 0.5, Math.PI * 1.5);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(26, headY + 9, 5, Math.PI * 1.5, Math.PI * 0.5);
    ctx.fill();

    // Cejas oscuras finas
    ctx.fillStyle = '#404040';
    ctx.fillRect(12, headY + 4, 5, 1.5);
    ctx.fillRect(19, headY + 4, 5, 1.5);

    // GAFAS REDONDAS METÁLICAS CON PUENTE (Clave de la foto)
    ctx.strokeStyle = '#94a3b8'; // Montura plateada
    ctx.lineWidth = 1.6;
    // Lente izquierda
    ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
    ctx.beginPath();
    ctx.arc(13.5, headY + 8, 3.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // Lente derecha
    ctx.beginPath();
    ctx.arc(21.5, headY + 8, 3.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // Puente de las gafas
    ctx.beginPath();
    ctx.moveTo(17.3, headY + 8);
    ctx.lineTo(17.7, headY + 8);
    ctx.stroke();

    // Ojos detrás de los cristales
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(12, headY + 7, 3, 2.5);
    ctx.fillRect(20, headY + 7, 3, 2.5);

    // Nariz y boca serena
    ctx.fillStyle = '#f4c7ab';
    ctx.fillRect(16, headY + 10, 2.5, 4); // Nariz
    ctx.fillStyle = '#c2410c';
    ctx.fillRect(14.5, headY + 15, 5, 1.5); // Labios

    // Oreja visible
    ctx.fillStyle = '#fbcfe8';
    ctx.fillRect(5.5, headY + 7, 3, 5);

    // --- 6. SOMBRERO TEJA SACERDOTAL / SATURNO (Si lo tiene puesto) ---
    if (this.hasHat) {
      ctx.fillStyle = '#0f172a';
      ctx.strokeStyle = '#020617';
      ctx.lineWidth = 1.5;
      // Ala ancha circular curvada del sombrero eclesiástico
      ctx.beginPath();
      ctx.ellipse(17, headY - 1, 16, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      // Copa del sombrero
      ctx.fillRect(11, headY - 8, 12, 8);
      ctx.strokeRect(11, headY - 8, 12, 8);
      // Cinta negra/dorada del sombrero
      ctx.fillStyle = '#ffe600';
      ctx.fillRect(11, headY - 3, 12, 2);
    }

    ctx.restore();

    ctx.restore();
  }
}

class GlitchDrone {
  constructor(x, y, range = 120) {
    this.startX = x;
    this.x = x;
    this.y = y;
    this.w = 28;
    this.h = 24;
    this.range = range;
    this.vx = 1.4;
    this.type = 'drone';
    this.isDead = false;
    this.animTimer = 0;
  }

  update(level) {
    this.animTimer += 0.1;
    this.x += this.vx;
    if (this.x > this.startX + this.range || this.x < this.startX - this.range) {
      this.vx *= -1;
    }
  }

  draw(ctx, camX, camY) {
    const px = this.x - camX;
    const py = this.y - camY;
    const hover = Math.sin(this.animTimer) * 3;
    const timeSec = Date.now() * 0.006;

    ctx.save();
    // Brillo y contorno de alta advertencia en rojo neón
    ctx.shadowColor = '#ff0055';
    ctx.shadowBlur = 14;

    // Turbinas laterales oscilantes
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(px - 5, py + hover + 4, 6, 14);
    ctx.fillRect(px + this.w - 1, py + hover + 4, 6, 14);
    ctx.fillStyle = '#00f0ff';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 8;
    ctx.fillRect(px - 4, py + hover + 16, 4, 3 + Math.sin(timeSec * 4) * 2);
    ctx.fillRect(px + this.w, py + hover + 16, 4, 3 + Math.cos(timeSec * 4) * 2);

    // Chasis principal blindado
    ctx.fillStyle = '#e11d48';
    ctx.shadowColor = '#ff0055';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(px + 4, py + hover);
    ctx.lineTo(px + this.w - 4, py + hover);
    ctx.lineTo(px + this.w, py + hover + 16);
    ctx.lineTo(px + this.w / 2, py + hover + this.h);
    ctx.lineTo(px, py + hover + 16);
    ctx.closePath();
    ctx.fill();

    // Borde blanco de alto contraste
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Placas de blindaje secundario
    ctx.fillStyle = '#1e1b4b';
    ctx.fillRect(px + 6, py + hover + 4, this.w - 12, 10);
    
    // Ojo escáner central cilíndrico amarillo brillante con haz
    ctx.fillStyle = '#ffe600';
    ctx.shadowColor = '#ffe600';
    ctx.shadowBlur = 10;
    const eyeOsc = (Math.sin(timeSec * 2.5) + 1) * 0.5;
    const eyeX = px + 8 + eyeOsc * (this.w - 20);
    ctx.fillRect(eyeX, py + hover + 6, 6, 6);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(eyeX + 1, py + hover + 7, 2, 2);

    // Luces de advertencia estroboscópicas
    ctx.fillStyle = (Math.floor(Date.now() / 150) % 2 === 0) ? '#ff0055' : '#ffffff';
    ctx.fillRect(px + 3, py + hover + 2, 3, 3);
    ctx.fillRect(px + this.w - 6, py + hover + 2, 3, 3);

    ctx.restore();
  }
}

class HopperBot {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.w = 26;
    this.h = 30;
    this.vx = 1.2;
    this.vy = 0;
    this.grounded = false;
    this.jumpTimer = 60 + Math.random() * 40;
    this.type = 'hopper';
    this.isDead = false;
  }

  update(level) {
    this.vy += 0.45;
    this.x += this.vx;

    for (const plat of level.platforms) {
      if (this.intersects(plat)) {
        if (this.vx > 0) {
          this.x = plat.x - this.w;
          this.vx *= -1;
        } else if (this.vx < 0) {
          this.x = plat.x + plat.w;
          this.vx *= -1;
        }
      }
    }

    this.y += this.vy;
    this.grounded = false;
    for (const plat of level.platforms) {
      if (this.intersects(plat)) {
        if (this.vy > 0) {
          this.y = plat.y - this.h;
          this.vy = 0;
          this.grounded = true;
        }
      }
    }

    this.jumpTimer--;
    if (this.jumpTimer <= 0 && this.grounded) {
      this.vy = -8.2;
      this.grounded = false;
      this.jumpTimer = 85 + Math.random() * 40;
    }
  }

  intersects(rect) {
    return (
      this.x < rect.x + rect.w &&
      this.x + this.w > rect.x &&
      this.y < rect.y + rect.h &&
      this.y + this.h > rect.y
    );
  }

  draw(ctx, camX, camY) {
    const px = this.x - camX;
    const py = this.y - camY;
    ctx.save();
    // Brillo dorado eléctrico ultra visible
    ctx.shadowColor = '#ffe600';
    ctx.shadowBlur = 14;

    const inAir = !this.grounded;
    const legCompress = (this.jumpTimer < 15 && this.grounded) ? 5 : 0;

    // Resorte / Patas articuladas mecánicas con amortiguación
    ctx.fillStyle = '#64748b';
    ctx.fillRect(px + 6, py + 18 + legCompress, 14, 10 - legCompress);
    // Espiral del resorte hidráulico
    ctx.strokeStyle = '#00f0ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px + 7, py + 20 + legCompress);
    ctx.lineTo(px + 19, py + 22 + legCompress);
    ctx.lineTo(px + 7, py + 25);
    ctx.lineTo(px + 19, py + 27);
    ctx.stroke();

    // Pezuña magnética inferior
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(px + 4, py + 27, 18, 3);
    ctx.fillStyle = '#00f0ff';
    ctx.fillRect(px + 6, py + 29, 14, 2); // chispa de salto

    // Chasis amarillo neón intenso
    ctx.fillStyle = '#facc15';
    ctx.fillRect(px + 2, py + 2 + legCompress, 22, 16);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(px + 2, py + 2 + legCompress, 22, 16);

    // Ojos / Visor hostil doble
    ctx.fillStyle = '#ff0055';
    ctx.shadowColor = '#ff0055';
    ctx.shadowBlur = 8;
    ctx.fillRect(px + 5, py + 6 + legCompress, 6, 5);
    ctx.fillRect(px + 15, py + 6 + legCompress, 6, 5);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(px + 7, py + 7 + legCompress, 2, 2);
    ctx.fillRect(px + 17, py + 7 + legCompress, 2, 2);

    // Antena superior que vibra al saltar
    ctx.fillStyle = '#94a3b8';
    ctx.fillRect(px + 12, py - 4 + legCompress, 2, 6);
    ctx.fillStyle = inAir ? '#00ff66' : '#ffe600';
    ctx.shadowColor = inAir ? '#00ff66' : '#ffe600';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(px + 13, py - 4 + legCompress, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

class TurretSentry {
  constructor(x, y, dir = -1) {
    this.x = x;
    this.y = y;
    this.w = 32;
    this.h = 32;
    this.dir = dir;
    this.shootTimer = 110;
    this.type = 'turret';
    this.isDead = false;
  }

  update(level, projectiles) {
    this.shootTimer--;
    if (this.shootTimer <= 0) {
      this.shootTimer = 130;
      audio.playLaser();
      projectiles.push({
        x: this.dir > 0 ? this.x + this.w : this.x - 12,
        y: this.y + 11,
        w: 14,
        h: 6,
        vx: this.dir * 4.2,
        color: '#ff0055'
      });
    }
  }

  draw(ctx, camX, camY) {
    const px = this.x - camX;
    const py = this.y - camY;
    ctx.save();
    ctx.shadowColor = '#ff0055';
    ctx.shadowBlur = 14;

    const chargeRatio = Math.max(0, 1 - (this.shootTimer / 130));

    // Base pesada blindada de torreta
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(px - 2, py + 20, this.w + 4, 12);
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(px - 2, py + 20, this.w + 4, 12);
    // Pernos mecánicos
    ctx.fillStyle = '#ffe600';
    ctx.fillRect(px + 2, py + 26, 3, 3);
    ctx.fillRect(px + this.w - 5, py + 26, 3, 3);

    // Cúpula / Cabina giratoria
    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.arc(px + this.w / 2, py + 14, 13, Math.PI, 0);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Cañón doble de plasma telescópico
    ctx.fillStyle = '#ff0055';
    ctx.shadowColor = '#ff0055';
    ctx.shadowBlur = 10 + chargeRatio * 15;
    const recoil = this.shootTimer > 120 ? 5 : 0;
    if (this.dir < 0) {
      ctx.fillRect(px - 12 + recoil, py + 7, 24, 7);
      ctx.fillStyle = '#00f0ff';
      ctx.fillRect(px - 14 + recoil, py + 5, 4, 11); // Boca del cañón
    } else {
      ctx.fillRect(px + 20 - recoil, py + 7, 24, 7);
      ctx.fillStyle = '#00f0ff';
      ctx.fillRect(px + 42 - recoil, py + 5, 4, 11);
    }

    // Núcleo central que se sobrecarga antes de disparar
    ctx.fillStyle = chargeRatio > 0.8 ? '#ffe600' : '#00f0ff';
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(px + this.w / 2, py + 13, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

class HunterDrone {
  constructor(x, y, distance = 160) {
    this.startX = x;
    this.startY = y;
    this.x = x;
    this.y = y;
    this.w = 30;
    this.h = 24;
    this.distance = distance;
    this.time = Math.random() * Math.PI;
    this.type = 'hunter';
    this.isDead = false;
  }

  update() {
    this.time += 0.04;
    this.x = this.startX + Math.sin(this.time) * this.distance;
    this.y = this.startY + Math.cos(this.time * 2) * 35;
  }

  draw(ctx, camX, camY) {
    const px = this.x - camX;
    const py = this.y - camY;
    ctx.save();
    // Brillo verde lima radioactivo ultra visible
    ctx.shadowColor = '#00ff66';
    ctx.shadowBlur = 14;

    // Alas afiladas fluorescentes
    ctx.fillStyle = '#00ff66';
    ctx.beginPath();
    ctx.moveTo(px + 15, py);
    ctx.lineTo(px - 4, py + 12);
    ctx.lineTo(px + 15, py + 20);
    ctx.lineTo(px + 34, py + 12);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Ojo cazador amarillo dorado
    ctx.fillStyle = '#1e1b4b';
    ctx.fillRect(px + 8, py + 7, 14, 10);
    ctx.fillStyle = '#ffe600';
    ctx.fillRect(px + 11, py + 9, 8, 6);
    ctx.restore();
  }
}

class ApexSentinel {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.w = 34;
    this.h = 44;
    this.vx = 0;
    this.vy = 0;
    this.type = 'apex';
    this.isDead = false;
    this.chargeTimer = 90;
    this.facing = 1;
  }

  update(level, player, projectiles) {
    this.vy += 0.45;
    const dist = player.x - this.x;
    if (Math.abs(dist) < 420) {
      this.facing = dist > 0 ? 1 : -1;
      this.vx = this.facing * 2.3;
    } else {
      this.vx = 0;
    }

    this.x += this.vx;
    for (const plat of level.platforms) {
      if (this.intersects(plat)) {
        if (this.vx > 0) this.x = plat.x - this.w;
        else if (this.vx < 0) this.x = plat.x + plat.w;
      }
    }

    this.y += this.vy;
    for (const plat of level.platforms) {
      if (this.intersects(plat)) {
        if (this.vy > 0) {
          this.y = plat.y - this.h;
          this.vy = 0;
        }
      }
    }

    this.chargeTimer--;
    if (this.chargeTimer <= 0 && Math.abs(dist) < 380) {
      this.chargeTimer = 110;
      audio.playLaser();
      projectiles.push({
        x: this.facing > 0 ? this.x + this.w : this.x - 14,
        y: this.y + 14,
        w: 16,
        h: 8,
        vx: this.facing * 5.2,
        color: '#ffe600'
      });
    }
  }

  intersects(rect) {
    return (
      this.x < rect.x + rect.w &&
      this.x + this.w > rect.x &&
      this.y < rect.y + rect.h &&
      this.y + this.h > rect.y
    );
  }

  draw(ctx, camX, camY) {
    const px = this.x - camX;
    const py = this.y - camY;
    const timeSec = Date.now() * 0.005;
    ctx.save();
    ctx.shadowColor = '#ff0055';
    ctx.shadowBlur = 18;

    const isCharging = this.chargeTimer < 35;
    const legWalk = Math.sin(timeSec * 6) * 4;

    // Patas mecánicas pesadas bípedas
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(px + 4 + legWalk, py + 34, 10, 10);
    ctx.fillRect(px + this.w - 14 - legWalk, py + 34, 10, 10);
    ctx.fillStyle = '#ff0055';
    ctx.fillRect(px + 4 + legWalk, py + 42, 10, 2);
    ctx.fillRect(px + this.w - 14 - legWalk, py + 42, 10, 2);

    // Chasis blindado rojo carmesí de alto contraste
    ctx.fillStyle = '#be123c';
    ctx.fillRect(px, py + 8, this.w, 28);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.strokeRect(px, py + 8, this.w, 28);

    // Placas de armadura dorada reforzada
    ctx.fillStyle = '#ffe600';
    ctx.shadowColor = '#ffe600';
    ctx.shadowBlur = 6;
    ctx.fillRect(px + 4, py + 11, this.w - 8, 8);
    ctx.fillRect(px + 6, py + 22, this.w - 12, 10);

    // Cañón de hombro con aviso luminoso
    ctx.fillStyle = '#1e293b';
    const cannonX = this.facing > 0 ? px + this.w - 6 : px - 6;
    ctx.fillRect(cannonX, py + 4, 12, 6);
    if (isCharging) {
      ctx.fillStyle = '#ffe600';
      ctx.shadowColor = '#ffe600';
      ctx.shadowBlur = 14;
      ctx.fillRect(this.facing > 0 ? px + this.w + 4 : px - 10, py + 3, 5, 8);
    }

    // Corona cibernética con LEDs de alerta
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(px + 2, py, 7, 8);
    ctx.fillRect(px + this.w - 9, py, 7, 8);
    ctx.fillStyle = '#00f0ff';
    ctx.fillRect(px + 4, py + 2, 3, 4);
    ctx.fillRect(px + this.w - 7, py + 2, 3, 4);

    // Visor central cian intenso amenazante
    ctx.fillStyle = isCharging ? '#ffe600' : '#00f0ff';
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 12;
    const eyeOffset = this.facing > 0 ? 16 : 4;
    ctx.fillRect(px + eyeOffset, py + 12, 14, 6);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(px + eyeOffset + 2, py + 13, 4, 2);

    ctx.restore();
  }
}

// ==========================================
// 6. CONTROLADOR PRINCIPAL DEL JUEGO (MOTOR 2D RETRO)
// ==========================================
class Game {
  constructor() {
    this.canvas2D = document.getElementById('gameCanvas');
    this.ctx = this.canvas2D.getContext('2d');

    this.width = 960;
    this.height = 540;

    this.input = {
      left: false,
      right: false,
      jump: false,
      jumpPressed: false
    };

    this.particles = new ParticleSystem();
    this.projectiles = [];
    this.hat = null; // Bumerán sagrado (sombrero del sacerdote)

    this.levels = buildLevels();
    this.currentLevelIdx = 0;
    this.score = 0;
    this.lives = 3;

    this.state = 'START';
    this.transitionTimer = 0;
    this.deathTimer = 0;

    this.camX = 0;
    this.camY = 0;

    this.setupInputs();
    this.loadLevel(0);

    this.loop = this.loop.bind(this);
    requestAnimationFrame(this.loop);
  }

  throwHat() {
    // El sombrero bumerán sólo está disponible a partir de la Fase 2 (nivel idx >= 1)
    if (this.currentLevelIdx < 1) return;
    if (!this.player || !this.player.hasHat || this.hat || this.player.isDead || this.state !== 'PLAYING') return;

    this.player.hasHat = false;
    audio.playHatThrow();

    const spawnX = this.player.facing === 1 ? this.player.x + this.player.w + 4 : this.player.x - 26;
    const spawnY = this.player.y + 12;
    const speed = 10;

    this.hat = {
      x: spawnX,
      y: spawnY,
      w: 28,
      h: 16,
      vx: this.player.facing * speed,
      vy: 0,
      rot: 0,
      state: 'OUTBOUND',
      timer: 0,
      maxTimer: 25 // Vuelo hacia adelante por ~250px antes de iniciar retorno
    };
  }

  setupInputs() {
    window.addEventListener('keydown', (e) => {
      audio.init();

      if (e.code === 'KeyA' || e.code === 'ArrowLeft') this.input.left = true;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') this.input.right = true;
      if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') {
        if (!this.input.jump) this.input.jumpPressed = true;
        this.input.jump = true;
        e.preventDefault();
      }

      // Lanzamiento de sombrero con Tecla J o Tecla F
      if (e.code === 'KeyJ' || e.code === 'KeyF') {
        this.throwHat();
      }

      if (e.code === 'KeyR') {
        if (this.state === 'GAME_OVER' || this.state === 'VICTORY') this.restartGame();
        else if (this.state === 'PLAYING') this.player.die();
      }

      if (e.code === 'KeyM') audio.toggleMute();
      if (e.code === 'KeyI') this.toggleControlLayout();

      if (this.state === 'START') {
        this.state = 'PLAYING';
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') this.input.left = false;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') this.input.right = false;
      if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') this.input.jump = false;
    });

    const triggerScreenTap = () => {
      audio.init();
      if (this.state === 'START') {
        this.state = 'PLAYING';
      } else if (this.state === 'GAME_OVER' || this.state === 'VICTORY') {
        this.restartGame();
      }
    };

    this.canvas2D.addEventListener('pointerdown', triggerScreenTap);
    window.addEventListener('pointerdown', (e) => {
      if (this.state === 'GAME_OVER' || this.state === 'VICTORY') {
        triggerScreenTap();
      }
    });

    this.setupTouchControls();
  }

  setupTouchControls() {
    const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (window.innerWidth <= 980);
    if (isTouch) {
      document.body.classList.add('touch-enabled');
    }

    const bindTouch = (elem, onStart, onEnd) => {
      if (!elem) return;
      const handleStart = (e) => {
        if (e.cancelable) e.preventDefault();
        e.stopPropagation();
        audio.init();
        elem.classList.add('active');
        onStart();
      };
      const handleEnd = (e) => {
        if (e.cancelable) e.preventDefault();
        e.stopPropagation();
        elem.classList.remove('active');
        onEnd();
      };

      elem.addEventListener('touchstart', handleStart, { passive: false });
      elem.addEventListener('touchend', handleEnd, { passive: false });
      elem.addEventListener('touchcancel', handleEnd, { passive: false });

      elem.addEventListener('mousedown', (e) => {
        audio.init();
        elem.classList.add('active');
        onStart();
      });
      elem.addEventListener('mouseup', () => {
        elem.classList.remove('active');
        onEnd();
      });
      elem.addEventListener('mouseleave', () => {
        elem.classList.remove('active');
        onEnd();
      });
    };

    const btnLeft = document.getElementById('touch-left');
    const btnRight = document.getElementById('touch-right');
    const btnJump = document.getElementById('touch-jump');
    const btnHat = document.getElementById('touch-hat');
    const btnMute = document.getElementById('touch-mute');
    const btnRestart = document.getElementById('touch-restart');
    const btnLayout = document.getElementById('touch-layout');

    this.controlsInverted = localStorage.getItem('cybersurge_controls_inverted') === 'true';
    this.applyControlLayout();

    if (btnLayout) {
      const handleLayoutToggle = (e) => {
        if (e.cancelable) e.preventDefault();
        e.stopPropagation();
        audio.init();
        this.toggleControlLayout();
      };
      btnLayout.addEventListener('touchstart', handleLayoutToggle, { passive: false });
      btnLayout.addEventListener('click', handleLayoutToggle);
    }

    bindTouch(btnLeft, () => { this.input.left = true; }, () => { this.input.left = false; });
    bindTouch(btnRight, () => { this.input.right = true; }, () => { this.input.right = false; });
    bindTouch(btnJump, () => {
      if (!this.input.jump) this.input.jumpPressed = true;
      this.input.jump = true;

      if (this.state === 'START') {
        this.state = 'PLAYING';
      } else if (this.state === 'GAME_OVER' || this.state === 'VICTORY') {
        this.restartGame();
      }
    }, () => {
      this.input.jump = false;
    });

    if (btnHat) {
      const triggerHat = (e) => {
        if (e.cancelable) e.preventDefault();
        e.stopPropagation();
        audio.init();
        this.throwHat();
      };
      btnHat.addEventListener('touchstart', triggerHat, { passive: false });
      btnHat.addEventListener('click', triggerHat);
    }

    if (btnMute) {
      const toggleAudio = (e) => {
        if (e.cancelable) e.preventDefault();
        e.stopPropagation();
        audio.init();
        const isMuted = audio.toggleMute();
        btnMute.innerText = isMuted ? '🔇 MUTE' : '🔊 AUDIO';
        btnMute.style.borderColor = isMuted ? '#ff0055' : '#a4b3d6';
        btnMute.style.color = isMuted ? '#ff0055' : '#e2e8f0';
      };
      btnMute.addEventListener('touchstart', toggleAudio, { passive: false });
      btnMute.addEventListener('click', toggleAudio);
    }

    if (btnRestart) {
      const triggerRestart = (e) => {
        if (e.cancelable) e.preventDefault();
        e.stopPropagation();
        audio.init();
        if (this.state === 'GAME_OVER' || this.state === 'VICTORY') {
          this.restartGame();
        } else if (this.state === 'PLAYING') {
          if (this.deathTimer === 0 && !this.player.isDead) this.player.die();
        }
      };
      btnRestart.addEventListener('touchstart', triggerRestart, { passive: false });
      btnRestart.addEventListener('click', triggerRestart);
    }
  }

  toggleControlLayout() {
    this.controlsInverted = !this.controlsInverted;
    localStorage.setItem('cybersurge_controls_inverted', this.controlsInverted);
    this.applyControlLayout();
    audio.playTone(660, 'sine', 0.08, 0.2);
  }

  applyControlLayout() {
    const bottomBar = document.querySelector('.mobile-bottom-bar');
    const btnLayout = document.getElementById('touch-layout');
    if (bottomBar) {
      if (this.controlsInverted) bottomBar.classList.add('layout-inverted');
      else bottomBar.classList.remove('layout-inverted');
    }
    if (btnLayout) {
      if (this.controlsInverted) {
        btnLayout.innerText = '⇄ MANDOS: ZURDO (SALTO IZQ)';
        btnLayout.style.borderColor = '#ffe600';
        btnLayout.style.color = '#ffe600';
      } else {
        btnLayout.innerText = '⇄ MANDOS: DIESTRO (SALTO DER)';
        btnLayout.style.borderColor = '#a4b3d6';
        btnLayout.style.color = '#e2e8f0';
      }
    }
  }

  loadLevel(idx) {
    this.currentLevelIdx = idx;
    this.level = this.levels[idx];
    this.player = new Player(this.level.playerStart.x, this.level.playerStart.y);
    this.projectiles = [];
    this.hat = null;
    this.deathTimer = 0;
    audio.setLevel(idx + 1);

    const btnHat = document.getElementById('touch-hat');
    if (btnHat) {
      btnHat.style.display = idx >= 1 ? 'flex' : 'none';
    }

    this.camX = Math.max(0, Math.min(this.level.width - this.width, this.player.x - this.width * 0.38));
    this.camY = Math.max(0, Math.min(this.level.height - this.height, this.player.y - this.height * 0.55));
  }

  restartGame() {
    this.levels = buildLevels();
    this.score = 0;
    this.lives = 3;
    this.deathTimer = 0;
    this.hat = null;
    this.state = 'PLAYING';
    this.loadLevel(0);
  }

  update() {
    if (this.state === 'PLAYING') {
      for (const plat of this.level.movingPlatforms) {
        if (plat.vertical) {
          plat.y += plat.vy;
          if (plat.y <= plat.minY || plat.y >= plat.maxY) plat.vy *= -1;
        } else {
          plat.x += plat.vx;
          if (plat.x <= plat.minX || plat.x >= plat.maxX) plat.vx *= -1;
        }
      }

      for (const haz of this.level.hazards) {
        if (haz.type === 'laser') {
          haz.timer = (haz.timer || 0) + 1;
          if (haz.timer % haz.cycle === 0) haz.active = !haz.active;
        }
      }

      if (this.deathTimer > 0) {
        this.deathTimer--;
        if (this.deathTimer === 0) {
          this.lives--;
          if (this.lives <= 0) {
            this.state = 'GAME_OVER';
            audio.playGameOver();
          } else {
            this.player.reset();
            this.player.invincibleTimer = 90;
            this.hat = null;
            this.camX = Math.max(0, Math.min(this.level.width - this.width, this.player.x - this.width * 0.38));
            this.camY = Math.max(0, Math.min(this.level.height - this.height, this.player.y - this.height * 0.55));
          }
        }
      } else {
        this.player.update(this.input, this.level, this.particles);

        if (this.player.isDead) {
          this.particles.emit(this.player.x + this.player.w / 2, this.player.y + this.player.h / 2, '#ff0055', 28, 4.5, 3.5, 50);
          this.deathTimer = 45;
          if (this.hat) {
            this.hat = null;
            this.player.hasHat = true;
          }
        }

        // LÓGICA DEL SOMBRERO BUMERÁN
        if (this.hat) {
          this.hat.rot += 0.35;
          this.hat.timer++;

          if (this.hat.state === 'OUTBOUND') {
            this.hat.x += this.hat.vx;
            if (this.hat.timer >= this.hat.maxTimer) {
              this.hat.state = 'RETURNING';
            }
          } else {
            // RETURNING: vuelve hacia el sacerdote
            const targetX = this.player.x + this.player.w / 2 - this.hat.w / 2;
            const targetY = this.player.y + 10;
            const dx = targetX - this.hat.x;
            const dy = targetY - this.hat.y;
            const dist = Math.hypot(dx, dy);

            if (dist < 26 || this.hat.timer > 120) {
              // Sombrero recuperado
              this.player.hasHat = true;
              this.hat = null;
              audio.playTone(760, 'sine', 0.1, 0.25);
              this.particles.emit(this.player.x + this.player.w / 2, this.player.y + 8, '#ffe600', 10, 2.5, 2, 20);
            } else {
              const returnSpeed = 11;
              this.hat.vx = (dx / dist) * returnSpeed;
              this.hat.vy = (dy / dist) * returnSpeed;
              this.hat.x += this.hat.vx;
              this.hat.y += this.hat.vy;
            }
          }

          if (this.hat) {
            // Estela dorada sagrada
            if (Math.random() < 0.6) {
              this.particles.emit(this.hat.x + this.hat.w / 2, this.hat.y + this.hat.h / 2, '#ffe600', 2, 1.2, 2, 15);
            }

            // Colisión con enemigos
            for (const enemy of this.level.enemies) {
              if (enemy.isDead) continue;
              if (
                this.hat.x < enemy.x + enemy.w &&
                this.hat.x + this.hat.w > enemy.x &&
                this.hat.y < enemy.y + enemy.h &&
                this.hat.y + this.hat.h > enemy.y
              ) {
                enemy.isDead = true;
                this.score += 250;
                audio.playHatHit();
                this.particles.emit(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2, '#ffe600', 22, 4.5, 3.5, 45);
                this.hat.state = 'RETURNING';
              }
            }
          }
        }

        for (const enemy of this.level.enemies) {
          if (enemy.isDead) continue;
          if (enemy.type === 'turret') enemy.update(this.level, this.projectiles);
          else if (enemy.type === 'apex') enemy.update(this.level, this.player, this.projectiles);
          else enemy.update(this.level);

          if (this.player.intersects(enemy)) {
            if (this.player.vy > 0 && (this.player.y + this.player.h - this.player.vy) <= enemy.y + 14) {
              enemy.isDead = true;
              this.player.bounceOnEnemy();
              this.score += 200;
              this.particles.emit(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2, '#ffe600', 16, 3.5, 3, 30);
            } else {
              if (this.player.hitHazard()) break;
            }
          }
        }

        for (let i = this.projectiles.length - 1; i >= 0; i--) {
          const p = this.projectiles[i];
          p.x += p.vx;
          if (this.player.intersects(p)) {
            this.player.hitHazard();
            this.projectiles.splice(i, 1);
            continue;
          }
          if (p.x < this.camX - 200 || p.x > this.camX + this.width + 200) {
            this.projectiles.splice(i, 1);
          }
        }

        for (const pad of this.level.jumpPads) {
          if (this.player.intersects(pad)) {
            this.player.vy = pad.force;
            this.player.grounded = false;
            audio.playSpring();
            this.particles.emit(pad.x + pad.w / 2, pad.y, '#00ff66', 14, 4, 3, 25);
          }
        }

        for (const haz of this.level.hazards) {
          if (haz.type === 'laser' && !haz.active) continue;
          if (this.player.intersects(haz)) {
            this.player.hitHazard();
            break;
          }
        }

        for (const core of this.level.cores) {
          if (!core.collected) {
            const coreRect = { x: core.x - 12, y: core.y - 12, w: 24, h: 24 };
            if (this.player.intersects(coreRect)) {
              core.collected = true;
              this.score += 100;
              audio.playCoin();
              this.particles.emit(core.x, core.y, '#00f0ff', 12, 3, 2.5, 25);
            }
          }
        }

        if (this.player.intersects(this.level.portal)) {
          audio.playLevelWin();
          if (this.currentLevelIdx < this.levels.length - 1) {
            this.state = 'LEVEL_WIN';
            this.transitionTimer = 110;
          } else {
            this.state = 'VICTORY';
          }
        }
      }

      if (this.deathTimer === 0) {
        const targetCamX = this.player.x - this.width * 0.38;
        this.camX += (targetCamX - this.camX) * 0.09;
        this.camX = Math.max(0, Math.min(this.level.width - this.width, this.camX));

        const targetCamY = this.player.y - this.height * 0.55;
        this.camY += (targetCamY - this.camY) * 0.08;
        this.camY = Math.max(0, Math.min(this.level.height - this.height, this.camY));
      }
    }

    if (this.state === 'LEVEL_WIN') {
      this.transitionTimer--;
      if (this.transitionTimer <= 0) {
        this.loadLevel(this.currentLevelIdx + 1);
        this.state = 'PLAYING';
      }
    }

    this.particles.update();
  }

  draw() {
    this.draw2D();

    this.drawHUD();
    if (this.state === 'START') this.drawStartScreen();
    if (this.state === 'LEVEL_WIN') this.drawLevelWinBanner();
    if (this.state === 'GAME_OVER') this.drawGameOverScreen();
    if (this.state === 'VICTORY') this.drawVictoryScreen();
  }

  draw2D() {
    this.ctx.clearRect(0, 0, this.width, this.height);
    this.drawParallaxBackground();

    const camX = Math.round(this.camX);
    const camY = Math.round(this.camY);

    const allPlatforms = [...this.level.platforms, ...this.level.movingPlatforms];
    for (const plat of allPlatforms) {
      if (plat.x + plat.w < camX || plat.x > camX + this.width) continue;
      const px = plat.x - camX;
      const py = plat.y - camY;

      this.ctx.save();
      if (plat.isMoving) {
        // Plataforma móvil: cuerpo azul pizarra con borde superior amarillo oro brillante e inconfundible
        this.ctx.fillStyle = '#1e294b';
        this.ctx.fillRect(px, py, plat.w, plat.h);
        this.ctx.strokeStyle = '#ffe600';
        this.ctx.lineWidth = 2;
        this.ctx.strokeRect(px, py, plat.w, plat.h);

        this.ctx.fillStyle = '#ffe600';
        this.ctx.shadowColor = '#ffe600';
        this.ctx.shadowBlur = 10;
        this.ctx.fillRect(px, py, plat.w, 7);
        this.ctx.fillStyle = '#ffffff';
        this.ctx.fillRect(px, py, plat.w, 2);

        this.ctx.fillStyle = '#05050d';
        this.ctx.fillRect(px + plat.w / 2 - 10, py + 10, 20, 5);
      } else {
        // Plataforma estática: cuerpo metálico visible con borde superior cian ultra nítido
        this.ctx.fillStyle = '#1e294b';
        this.ctx.fillRect(px, py, plat.w, plat.h);
        this.ctx.strokeStyle = '#38bdf8';
        this.ctx.lineWidth = 2;
        this.ctx.strokeRect(px, py, plat.w, plat.h);

        this.ctx.fillStyle = '#00f0ff';
        this.ctx.shadowColor = '#00f0ff';
        this.ctx.shadowBlur = 12;
        this.ctx.fillRect(px, py, plat.w, 8);
        this.ctx.fillStyle = '#ffffff';
        this.ctx.fillRect(px, py, plat.w, 2);
      }
      this.ctx.restore();
    }

    for (const pad of this.level.jumpPads) {
      const px = pad.x - camX;
      const py = pad.y - camY;
      this.ctx.save();
      this.ctx.fillStyle = '#00ff66';
      this.ctx.shadowColor = '#00ff66';
      this.ctx.shadowBlur = 10;
      this.ctx.fillRect(px, py + 6, pad.w, pad.h - 6);
      this.ctx.fillStyle = '#ffffff';
      this.ctx.fillRect(px + 4, py, pad.w - 8, 6);
      this.ctx.restore();
    }

    for (const haz of this.level.hazards) {
      const px = haz.x - camX;
      const py = haz.y - camY;
      this.ctx.save();
      if (haz.type === 'acid') {
        this.ctx.fillStyle = '#00ff66';
        this.ctx.shadowColor = '#00ff66';
        this.ctx.shadowBlur = 14;
        this.ctx.fillRect(px, py + 10, haz.w, haz.h);
        this.ctx.fillStyle = '#a6ffcb';
        for (let bx = 0; bx < haz.w; bx += 20) {
          const wave = Math.sin((Date.now() * 0.005) + bx) * 4;
          this.ctx.fillRect(px + bx, py + 8 + wave, 14, 4);
        }
      } else if (haz.type === 'spikes') {
        this.ctx.fillStyle = '#ff0055';
        this.ctx.shadowColor = '#ff0055';
        this.ctx.shadowBlur = 10;
        const spikeW = 16;
        const count = Math.floor(haz.w / spikeW);
        for (let s = 0; s < count; s++) {
          this.ctx.beginPath();
          this.ctx.moveTo(px + s * spikeW, py + haz.h);
          this.ctx.lineTo(px + s * spikeW + spikeW / 2, py);
          this.ctx.lineTo(px + (s + 1) * spikeW, py + haz.h);
          this.ctx.fill();
        }
      } else if (haz.type === 'laser') {
        if (haz.active) {
          this.ctx.fillStyle = '#ff0055';
          this.ctx.shadowColor = '#ff0055';
          this.ctx.shadowBlur = 18;
          this.ctx.fillRect(px, py, haz.w, haz.h);
          this.ctx.fillStyle = '#ffffff';
          this.ctx.fillRect(px + 2, py, haz.w - 4, haz.h);
        } else {
          this.ctx.fillStyle = 'rgba(255, 0, 85, 0.15)';
          this.ctx.fillRect(px + 3, py, 2, haz.h);
        }
      }
      this.ctx.restore();
    }

    const time = Date.now() * 0.004;
    for (const core of this.level.cores) {
      if (core.collected) continue;
      const px = core.x - camX;
      const py = core.y - camY + Math.sin(time + core.x) * 4;
      this.ctx.save();
      this.ctx.translate(px, py);
      this.ctx.rotate(time * 0.8);
      this.ctx.fillStyle = '#00f0ff';
      this.ctx.shadowColor = '#00f0ff';
      this.ctx.shadowBlur = 12;
      this.ctx.fillRect(-8, -8, 16, 16);
      this.ctx.fillStyle = '#ffffff';
      this.ctx.fillRect(-4, -4, 8, 8);
      this.ctx.restore();
    }

    const p = this.level.portal;
    const portalX = p.x - camX;
    const portalY = p.y - camY;
    this.ctx.save();
    this.ctx.shadowColor = '#00f0ff';
    this.ctx.shadowBlur = 20;
    this.ctx.strokeStyle = '#00f0ff';
    this.ctx.lineWidth = 3;
    this.ctx.strokeRect(portalX, portalY, p.w, p.h);
    this.ctx.fillStyle = 'rgba(0, 240, 255, 0.15)';
    this.ctx.fillRect(portalX, portalY, p.w, p.h);
    this.ctx.fillStyle = '#ff0055';
    this.ctx.shadowColor = '#ff0055';
    const portalPulse = Math.sin(time * 2) * 6;
    this.ctx.fillRect(portalX + 8, portalY + 12 + portalPulse / 2, p.w - 16, p.h - 24 - portalPulse);
    this.ctx.restore();

    for (const enemy of this.level.enemies) {
      if (!enemy.isDead) enemy.draw(this.ctx, camX, camY);
    }

    for (const proj of this.projectiles) {
      this.ctx.save();
      this.ctx.fillStyle = proj.color;
      this.ctx.shadowColor = proj.color;
      this.ctx.shadowBlur = 10;
      this.ctx.fillRect(proj.x - camX, proj.y - camY, proj.w, proj.h);
      this.ctx.restore();
    }

    // Dibujar sombrero arrojado en vuelo (bumerán)
    if (this.hat) {
      const hx = Math.round(this.hat.x - camX);
      const hy = Math.round(this.hat.y - camY);
      this.ctx.save();
      this.ctx.translate(hx + this.hat.w / 2, hy + this.hat.h / 2);
      this.ctx.rotate(this.hat.rot);
      this.ctx.shadowColor = '#ffe600';
      this.ctx.shadowBlur = 16;

      // Ala exterior del saturno
      this.ctx.fillStyle = '#0f172a';
      this.ctx.strokeStyle = '#ffe600';
      this.ctx.lineWidth = 1.8;
      this.ctx.beginPath();
      this.ctx.ellipse(0, 0, 16, 6, 0, 0, Math.PI * 2);
      this.ctx.fill();
      this.ctx.stroke();

      // Copa del sombrero
      this.ctx.fillStyle = '#1e293b';
      this.ctx.beginPath();
      this.ctx.arc(0, 0, 5, 0, Math.PI * 2);
      this.ctx.fill();

      // Centro bendito
      this.ctx.fillStyle = '#ffe600';
      this.ctx.beginPath();
      this.ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
      this.ctx.fill();

      this.ctx.restore();
    }

    this.player.draw(this.ctx, camX, camY);
    this.particles.draw(this.ctx, camX, camY);
  }

  drawParallaxBackground() {
    // Fondo de alta visibilidad: degradado medianoche limpio
    const grad = this.ctx.createLinearGradient(0, 0, 0, this.height);
    grad.addColorStop(0, '#151d3b');
    grad.addColorStop(1, '#241a4a');
    this.ctx.fillStyle = grad;
    this.ctx.fillRect(0, 0, this.width, this.height);

    // Siluetas lejanas limpias, sin interferencias
    this.ctx.save();
    this.ctx.fillStyle = '#11172e';
    const bOffset = (this.camX * 0.12) % 240;
    for (let x = -bOffset - 60; x < this.width + 120; x += 120) {
      const h = 200 + ((Math.sin(x * 0.05) * 1000) % 110);
      this.ctx.fillRect(x, this.height - h, 100, h);
    }

    // Siluetas intermedias
    this.ctx.fillStyle = '#192242';
    const mOffset = (this.camX * 0.25) % 320;
    for (let x = -mOffset - 70; x < this.width + 120; x += 160) {
      const h = 120 + ((Math.cos(x * 0.04) * 1000) % 70);
      this.ctx.fillRect(x, this.height - h, 130, h);
    }
    this.ctx.restore();
  }

  drawHUD() {
    this.ctx.save();
    this.ctx.font = 'bold 15px "Segoe UI", sans-serif';

    this.ctx.fillStyle = 'rgba(9, 8, 20, 0.75)';
    this.ctx.fillRect(15, 12, 450, 40);
    this.ctx.strokeStyle = '#00f0ff';
    this.ctx.lineWidth = 1.5;
    this.ctx.strokeRect(15, 12, 450, 40);

    this.ctx.fillStyle = '#ff0055';
    this.ctx.shadowColor = '#ff0055';
    this.ctx.shadowBlur = 6;
    this.ctx.fillText('VIDAS:', 26, 37);
    for (let i = 0; i < 3; i++) {
      if (i < this.lives) {
        this.ctx.fillStyle = '#ff0055';
        this.ctx.fillRect(80 + i * 20, 24, 14, 16);
      } else {
        this.ctx.strokeStyle = 'rgba(255, 0, 85, 0.4)';
        this.ctx.strokeRect(80 + i * 20, 24, 14, 16);
      }
    }

    this.ctx.fillStyle = '#00f0ff';
    this.ctx.shadowColor = '#00f0ff';
    this.ctx.fillText(`SCORE: ${this.score}`, 155, 37);

    this.ctx.fillStyle = '#ffe600';
    this.ctx.shadowColor = '#ffe600';
    this.ctx.fillText(`SECTOR ${this.currentLevelIdx + 1}/5`, 265, 37);

    // Estado del sombrero para el HUD si estamos en Fase 2+
    if (this.currentLevelIdx >= 1) {
      this.ctx.font = 'bold 12px "Segoe UI", sans-serif';
      if (this.player.hasHat && !this.hat) {
        this.ctx.fillStyle = '#ffe600';
        this.ctx.shadowColor = '#ffe600';
        this.ctx.fillText('[J/F/👒: SOMBRERO]', 370, 37);
      } else {
        this.ctx.fillStyle = '#a4b3d6';
        this.ctx.shadowColor = '#a4b3d6';
        this.ctx.fillText('[👒 EN VUELO]', 370, 37);
      }
    }

    this.ctx.fillStyle = audio.muted ? '#ff0055' : '#00ff66';
    this.ctx.shadowColor = audio.muted ? '#ff0055' : '#00ff66';
    this.ctx.font = 'bold 12px "Segoe UI", sans-serif';
    this.ctx.fillText(audio.muted ? '[M: MUTED]' : '[M: AUDIO ON]', this.width - 110, 37);

    this.ctx.restore();
  }

  drawStartScreen() {
    this.ctx.save();
    this.ctx.fillStyle = 'rgba(6, 5, 16, 0.88)';
    this.ctx.fillRect(0, 0, this.width, this.height);

    this.ctx.textAlign = 'center';
    this.ctx.font = '900 48px "Segoe UI", sans-serif';
    this.ctx.fillStyle = '#00f0ff';
    this.ctx.shadowColor = '#00f0ff';
    this.ctx.shadowBlur = 25;
    this.ctx.fillText('CYBER SURGE', this.width / 2, 160);

    this.ctx.font = '700 22px "Segoe UI", sans-serif';
    this.ctx.fillStyle = '#ff0055';
    this.ctx.shadowColor = '#ff0055';
    this.ctx.shadowBlur = 15;
    this.ctx.fillText('MISIÓN SACERDOTAL: PROTOCOL ZERO', this.width / 2, 205);

    this.ctx.font = '16px "Segoe UI", sans-serif';
    this.ctx.fillStyle = '#e2e8f0';
    this.ctx.shadowBlur = 0;
    this.ctx.fillText('Supera los 5 sectores y purga los drones pisándolos.', this.width / 2, 265);
    this.ctx.fillText('Sector 1: Drones de patrulla | Sector 2: Acid Foundry (¡Desbloquea Sombrero Bumerán!)', this.width / 2, 295);
    this.ctx.fillText('Sector 3: Láseres & Torretas | Sector 4: Avispones | Sector 5: Apex Sentinels', this.width / 2, 325);

    this.ctx.font = 'bold 15px "Segoe UI", sans-serif';
    this.ctx.fillStyle = '#ffe600';
    this.ctx.shadowColor = '#ffe600';
    this.ctx.shadowBlur = 8;
    this.ctx.fillText('👒 HABILIDAD SAGRADA (FASE 2+): Pulsa [ J ], [ F ] o [ 👒 ] para lanzar tu sombrero bumerán', this.width / 2, 365);

    this.ctx.font = '14px "Segoe UI", sans-serif';
    this.ctx.fillStyle = '#a4b3d6';
    this.ctx.shadowBlur = 0;
    const modeText = this.controlsInverted
      ? 'MANDOS TÁCTILES: [ ▲ SALTO (IZQ) ]  [ ◀ ▶ MOVIMIENTO (DER) ]  (PULSA ⇄ O "I")'
      : 'MANDOS TÁCTILES: [ ◀ ▶ MOVIMIENTO (IZQ) ]  [ ▲ SALTO (DER) ]  (PULSA ⇄ O "I")';
    this.ctx.fillText(modeText, this.width / 2, 405);

    const pulse = Math.abs(Math.sin(Date.now() * 0.004));
    this.ctx.font = 'bold 20px "Segoe UI", sans-serif';
    this.ctx.fillStyle = `rgba(0, 240, 255, ${0.4 + pulse * 0.6})`;
    this.ctx.shadowColor = '#00f0ff';
    this.ctx.shadowBlur = 12;
    this.ctx.fillText('>>> PRESIONA CUALQUIER TECLA O HAZ CLIC PARA COMENZAR <<<', this.width / 2, 455);

    this.ctx.restore();
  }

  drawLevelWinBanner() {
    this.ctx.save();
    this.ctx.fillStyle = 'rgba(6, 5, 16, 0.7)';
    this.ctx.fillRect(0, this.height / 2 - 60, this.width, 120);

    this.ctx.textAlign = 'center';
    this.ctx.font = 'bold 36px "Segoe UI", sans-serif';
    this.ctx.fillStyle = '#00ff66';
    this.ctx.shadowColor = '#00ff66';
    this.ctx.shadowBlur = 18;
    this.ctx.fillText('¡SECTOR COMPLETADO!', this.width / 2, this.height / 2);

    this.ctx.font = '18px "Segoe UI", sans-serif';
    this.ctx.fillStyle = '#00f0ff';
    this.ctx.shadowColor = '#00f0ff';
    this.ctx.shadowBlur = 8;
    this.ctx.fillText('CARGANDO SIGUIENTE SECTOR...', this.width / 2, this.height / 2 + 35);
    this.ctx.restore();
  }

  drawGameOverScreen() {
    this.ctx.save();
    this.ctx.fillStyle = 'rgba(6, 5, 16, 0.92)';
    this.ctx.fillRect(0, 0, this.width, this.height);

    this.ctx.textAlign = 'center';
    this.ctx.font = '900 52px "Segoe UI", sans-serif';
    this.ctx.fillStyle = '#ff0055';
    this.ctx.shadowColor = '#ff0055';
    this.ctx.shadowBlur = 24;
    this.ctx.fillText('SISTEMA COLAPSADO', this.width / 2, 220);

    this.ctx.font = '20px "Segoe UI", sans-serif';
    this.ctx.fillStyle = '#00f0ff';
    this.ctx.shadowBlur = 6;
    this.ctx.fillText(`PUNTUACIÓN FINAL: ${this.score}`, this.width / 2, 275);

    this.ctx.font = 'bold 20px "Segoe UI", sans-serif';
    this.ctx.fillStyle = '#ffe600';
    this.ctx.fillText('PRESIONA [ R ] O HAZ CLIC PARA REINICIAR', this.width / 2, 350);
    this.ctx.restore();
  }

  drawVictoryScreen() {
    this.ctx.save();
    this.ctx.fillStyle = 'rgba(6, 5, 16, 0.94)';
    this.ctx.fillRect(0, 0, this.width, this.height);

    this.ctx.textAlign = 'center';
    this.ctx.font = '900 50px "Segoe UI", sans-serif';
    this.ctx.fillStyle = '#00ff66';
    this.ctx.shadowColor = '#00ff66';
    this.ctx.shadowBlur = 25;
    this.ctx.fillText('¡PROTOCOLO ZERO COMPLETADO!', this.width / 2, 200);

    this.ctx.font = '22px "Segoe UI", sans-serif';
    this.ctx.fillStyle = '#00f0ff';
    this.ctx.shadowColor = '#00f0ff';
    this.ctx.shadowBlur = 10;
    this.ctx.fillText('El Sacerdote ha purificado todos los sectores de la red central.', this.width / 2, 255);

    this.ctx.font = 'bold 24px "Segoe UI", sans-serif';
    this.ctx.fillStyle = '#ffe600';
    this.ctx.fillText(`PUNTUACIÓN TOTAL: ${this.score}`, this.width / 2, 310);

    this.ctx.font = 'bold 18px "Segoe UI", sans-serif';
    this.ctx.fillStyle = '#ffffff';
    this.ctx.fillText('PRESIONA [ R ] O HAZ CLIC PARA VOLVER A JUGAR', this.width / 2, 385);
    this.ctx.restore();
  }

  loop() {
    this.update();
    this.draw();
    requestAnimationFrame(this.loop);
  }
}

// Inicializar el juego
window.addEventListener('load', () => {
  new Game();
});
</script>
</body>
</html>
